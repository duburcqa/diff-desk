<title>Genesis Diff Desk</title>
<style>
  :root {
    --ground: #f6f7f9;
    --surface: #ffffff;
    --surface-sunk: #f0f2f6;
    --ink: #151a21;
    --muted: #5c6675;
    --faint: #8a94a4;
    --rule: #e2e6ec;
    --rule-strong: #cdd4de;
    --accent: #2f5aa8;
    --accent-soft: #e6ecf8;
    --add-ink: #17614a;
    --add-bg: #e8f3ed;
    --add-gutter: #bfe0cf;
    --del-ink: #8e3628;
    --del-bg: #faeae6;
    --del-gutter: #f0c6bb;
    --stale: #8a5a12;
    --stale-bg: #fbf1de;
    --key: #cf222e;
    --str: #0a3069;
    --num: #0550ae;
    --shadow: 0 1px 2px rgba(21, 26, 33, 0.06), 0 8px 24px -16px rgba(21, 26, 33, 0.24);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* The dark palette is written twice, once for the system setting and once for the explicit toggle, so a token raised
     in one is raised in the other or the two disagree. Text holds at least 7:1 over every ground it sits on - a changed
     line's own tint included - and the quieter greys that carry line numbers and labels hold 4.5:1. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #11141a;
      --surface: #151a21;
      --surface-sunk: #1b212a;
      --ink: #f2f5fa;
      --muted: #adb8c9;
      --faint: #8b95a6;
      --rule: #2c333f;
      --rule-strong: #414b59;
      --accent: #93aeec;
      --accent-soft: #1b2536;
      --add-ink: #a8e6c3;
      --add-bg: #132d20;
      --add-gutter: #2c5340;
      --del-ink: #f5b3a4;
      --del-bg: #331b17;
      --del-gutter: #5c332a;
      --stale: #e0b567;
      --stale-bg: #2a2113;
      --key: #ff7b72;
      --str: #a5d6ff;
      --num: #79c0ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -16px rgba(0, 0, 0, 0.7);
    }
  }

  :root[data-theme="dark"] {
    --ground: #11141a;
    --surface: #151a21;
    --surface-sunk: #1b212a;
    --ink: #f2f5fa;
    --muted: #adb8c9;
    --faint: #8b95a6;
    --rule: #2c333f;
    --rule-strong: #414b59;
    --accent: #93aeec;
    --accent-soft: #1b2536;
    --add-ink: #a8e6c3;
    --add-bg: #132d20;
    --add-gutter: #2c5340;
    --del-ink: #f5b3a4;
    --del-bg: #331b17;
    --del-gutter: #5c332a;
    --stale: #e0b567;
    --stale-bg: #2a2113;
    --key: #ff7b72;
    --str: #a5d6ff;
    --num: #79c0ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -16px rgba(0, 0, 0, 0.7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .label { font-size: 10px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .num { font-variant-numeric: tabular-nums; }
  .status { font-size: 11.5px; color: var(--muted); }

  /* Measured from the header itself at runtime: it wraps at narrow widths, so no fixed value can be right. */
  :root { --head: 58px; }
  .status b { color: var(--add-ink); font-weight: 600; }

  header {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    /* Three groups: what is being reviewed, how it is being looked at, what has come of it. The parts that can give
       way shrink first, and what still does not fit folds onto another line - so every control stays in the window at
       any width, rather than sitting off the edge of a bar that scrolls. */
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
  }

  .brand { display: flex; align-items: baseline; gap: 8px; flex: none; min-width: 0; }
  .brand h1 { white-space: nowrap; }
  .brand .base { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .brand .base { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .tabs { display: flex; gap: 2px; padding: 2px; background: var(--surface-sunk); border-radius: 7px; }
  .tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  /* Shown only on the tab already chosen, where a click opens the pull request rather than selecting it again. */
  .tab .away { margin-left: 5px; font-size: 10px; color: var(--faint); opacity: 0; }
  .tab[aria-selected="true"] .away { opacity: 1; }
  .tab[aria-selected="true"]:hover .away { color: var(--accent); }

  select, .toggle, .search input {
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 6px;
    padding: 6px 9px;
  }
  select { max-width: 44ch; }
  /* The filter takes what the rest does not need, and gives it back first. */
  .search { position: relative; display: flex; align-items: center; flex: 1 1 12ch; min-width: 8ch; margin-right: auto; }
  .search input { width: 100%; min-width: 0; padding-left: 26px; }
  .search svg { position: absolute; left: 8px; width: 13px; height: 13px; color: var(--faint); }
  /* What the filter matches, listed under it for picking by name: a review of seventy files is steered by name sooner
     than by scrolling. The list floats rather than the box growing, since a box that grew would move every control
     beside it in the bar. */
  #veil { position: fixed; inset: 0; z-index: 44; background: rgb(0 0 0 / 30%); }
  /* The bar stays under the veil: while the list is open, the box being typed in is the one inside the overlay, so the
     one in the bar is dimmed with everything else it belongs to. */
  body.picking #q { color: transparent; text-shadow: none; }
  #palette {
    position: fixed;
    z-index: 45;
    left: 50%;
    top: 11vh;
    transform: translateX(-50%);
    width: min(720px, calc(100vw - 32px));
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    border: 1px solid var(--rule-strong);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: 0 18px 48px rgb(0 0 0 / 38%);
  }
  #palette .search { flex: none; width: 100%; margin: 0; }
  #picks { max-height: min(56vh, 480px); overflow-y: auto; }
  #veil[hidden], #palette[hidden] { display: none; }
  .pick {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    padding: 5px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    text-align: left;
    font: inherit;
    color: var(--ink);
    cursor: pointer;
  }
  .pick[data-on="true"] { background: var(--accent-soft); }
  .pick b { flex: none; font-family: var(--mono); font-size: 12px; }
  .pick .where { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11.5px; }
  .pick .tick { flex: none; width: 12px; height: 12px; color: var(--add-ink); opacity: 0; }
  .pick[data-done="true"] .tick { opacity: 1; }
  .pick[data-done="true"] b { color: var(--faint); }
  .picknone { padding: 6px 8px; color: var(--muted); font-size: 12px; }

  /* Never let a label fold onto a second line: that is what turned the bar into two rows. */
  .toggle { position: relative; cursor: pointer; flex: none; white-space: nowrap; }
  #scope { flex: none; max-width: 26ch; }
  #goto { flex: none; width: 7ch; text-align: center; font-family: var(--mono); }
  #goto.lost { border-color: var(--del-ink); color: var(--del-ink); }
  .tabs { flex: none; }
  .toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  select:focus-visible, .toggle:focus-visible, input:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Sized to the label beside them and never resized, so the bar holds still whether or not there is anywhere to go.
     One above the other rather than side by side: the pair then costs a single control's width, in a bar that has none
     to spare, and the two together stand as tall as everything around them. */
  .steps { display: grid; gap: 2px; }
  .step { flex: none; width: 20px; height: 12px; padding: 0; display: grid; place-items: center; cursor: pointer; }
  .step svg { width: 9px; height: 9px; }
  .step:disabled { color: var(--faint); cursor: default; }

  .totals { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; }
  .totals .plus { color: var(--add-ink); }
  .totals .minus { color: var(--del-ink); }

  .tally { display: flex; align-items: center; gap: 12px; flex: none; }
  .progress { display: flex; align-items: center; gap: 7px; }
  .progress .track { width: 74px; height: 5px; border-radius: 3px; background: var(--rule); overflow: hidden; }
  .progress .track i { display: block; height: 100%; background: var(--add-ink); }
  /* What has been read and what has come back to be read again, one line each: side by side they spend width the bar
     needs elsewhere. */
  .progress .label { white-space: pre-line; line-height: 1.25; text-align: right; }
  .progress .label[data-stale="true"] { color: var(--stale); }

  .shell { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); align-items: start; }
  @media (max-width: 900px) { .shell { grid-template-columns: minmax(0, 1fr); } }

  aside {
    position: sticky;
    top: var(--head);
    max-height: calc(100vh - var(--head));
    overflow-y: auto;
    padding: 14px 10px 40px 16px;
    border-right: 1px solid var(--rule);
  }
  @media (max-width: 900px) { aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--rule); } }

  aside h2 { margin: 0 0 8px 4px; }
  .filelist { display: flex; flex-direction: column; gap: 1px; }

  .folder > .kids { display: none; }
  .folder[data-open="true"] > .kids { display: block; }
  .foldername {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding: 4px 6px;
    font: inherit;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 5px;
    cursor: pointer;
    text-align: left;
  }
  .foldername:hover { background: var(--surface-sunk); color: var(--ink); }
  .foldername .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foldername .num { color: var(--faint); font-family: var(--mono); font-size: 10.5px; }
  .foldername .chev { flex: none; transition: transform 0.12s ease; }
  .folder[data-open="false"] > .foldername .chev { transform: rotate(-90deg); }

  .fileitem {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 7px;
    /* A button is only as wide as its text, which would put every row's counts wherever its name happened to end. */
    width: 100%;
    padding: 5px 8px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .fileitem:hover { background: var(--surface-sunk); }
  .fileitem[data-current="true"] { background: var(--accent-soft); }
  .fileitem[data-done="true"] .name { color: var(--faint); text-decoration: line-through; }
  /* Read once, and changed since: the tick stands but in the colour of anything gone stale. */
  .fileitem[data-stale="true"] .tick { opacity: 1; color: var(--stale); }
  .fileitem[data-stale="true"] .name { color: var(--stale); }
  /* The indentation of the tree is padding on the row, so the row keeps the panel's width and the counts of every file
     line up down one edge whatever depth they sit at. */
  .fileitem { box-sizing: border-box; }
  .fileitem .name { flex: 1; min-width: 0; font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .fileitem .stat { flex: none; margin-left: auto; display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .fileitem .stat .num { min-width: 3ch; text-align: right; }
  .tick { width: 12px; height: 12px; color: var(--add-ink); flex: none; opacity: 0; }
  .fileitem[data-done="true"] .tick { opacity: 1; }

  .bar { display: flex; width: 32px; height: 5px; border-radius: 3px; overflow: hidden; background: var(--rule); }
  .bar i { display: block; height: 100%; }
  .bar .a { background: var(--add-gutter); }
  .bar .d { background: var(--del-gutter); }

  main { padding: 16px 20px 60vh; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .commitnote {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
  }
  .commitnote .sha { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .commitnote .subject { font-weight: 600; }

  .file { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; scroll-margin-top: calc(var(--head) + 6px); }

  body.hide-done .file[data-done="true"] { display: none; }

  .filehead {
    position: sticky;
    top: var(--head);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    border-radius: 7px 7px 0 0;
    background: var(--surface);
  }
  .filehead .grow {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 0 1 auto;
    min-width: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .filehead .grow:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filehead .path { font-family: var(--mono); font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
  .counts { display: flex; gap: 8px; margin-left: auto; font-family: var(--mono); font-size: 11.5px; }
  .counts .plus { color: var(--add-ink); }
  .counts .minus { color: var(--del-ink); }
  .chev { width: 12px; height: 12px; color: var(--faint); flex: none; transition: transform 0.12s ease; }
  .file[data-open="false"] .chev { transform: rotate(-90deg); }
  .file[data-open="false"] .body { display: none; }

  .icon { position: relative; flex: none; display: grid; place-items: center; width: 22px; height: 20px; padding: 0; color: var(--faint); background: transparent; border: 0; border-radius: 5px; cursor: pointer; }
  .icon svg { width: 13px; height: 13px; }
  .icon:hover { color: var(--accent); background: var(--surface-sunk); }
  .icon::after {
    content: attr(data-tip);
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    padding: 3px 7px;
    border-radius: 5px;
    background: var(--ink);
    color: var(--surface);
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    /* After a beat, so passing the cursor over a header says nothing. */
    transition: opacity 90ms ease 260ms;
  }
  .icon:hover::after, .icon:focus-visible::after { opacity: 1; }
  .copy[data-copied] { color: var(--add-ink); }

  .seen { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  .seen input { accent-color: var(--add-ink); width: 14px; height: 14px; }

  .chip { font-size: 10px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--surface-sunk); color: var(--muted); }
  .chip.added { background: var(--add-bg); color: var(--add-ink); }
  .chip.deleted { background: var(--del-bg); color: var(--del-ink); }
  .chip.stale { background: var(--stale-bg); color: var(--stale); }

  .body { overflow-x: auto; border-radius: 0 0 7px 7px; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  td { padding: 0 0 0 6px; vertical-align: top; white-space: pre; }
  td.ln {
    user-select: none;
    width: 1%;
    padding: 0 8px;
    text-align: right;
    color: var(--faint);
    background: var(--surface-sunk);
    font-variant-numeric: tabular-nums;
    border-right: 1px solid var(--rule);
    cursor: pointer;
  }
  td.mark { width: 1%; padding: 0 4px 0 6px; color: var(--faint); user-select: none; }
  td.gut { width: 21px; min-width: 21px; padding: 0 3px; user-select: none; }
  td.code .hljs-comment, td.code .hljs-quote { color: var(--faint); font-style: italic; }
  td.code .hljs-string, td.code .hljs-regexp, td.code .hljs-char.escape_, td.code .hljs-subst { color: var(--str); }
  td.code .hljs-number, td.code .hljs-literal { color: var(--num); }
  td.code .hljs-keyword, td.code .hljs-built_in, td.code .hljs-type, td.code .hljs-meta { color: var(--key); }
  td.code .hljs-title, td.code .hljs-title.class_, td.code .hljs-title.function_ { color: var(--accent); }
  td.code .hljs-attr, td.code .hljs-attribute, td.code .hljs-property, td.code .hljs-variable { color: var(--muted); }
  td.code .hljs-section, td.code .hljs-name, td.code .hljs-selector-tag { color: var(--key); }
  td.code .hljs-deletion { color: var(--del-ink); }
  td.code .hljs-addition { color: var(--add-ink); }
  tr.a td.code, tr.a td.mark { background: var(--add-bg); color: var(--ink); }
  tr.a td.ln { background: color-mix(in srgb, var(--add-bg) 70%, var(--surface-sunk)); }
  tr.d td.code, tr.d td.mark { background: var(--del-bg); color: var(--ink); }
  tr.d td.ln { background: color-mix(in srgb, var(--del-bg) 70%, var(--surface-sunk)); }
  tr.h td { background: var(--surface-sunk); color: var(--muted); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 3px 8px; }
  tr.sel td {
    background-image: linear-gradient(
      color-mix(in srgb, var(--accent) 13%, transparent),
      color-mix(in srgb, var(--accent) 13%, transparent)
    );
  }
  tr.sel td.ln:first-child { box-shadow: inset 2px 0 0 var(--accent); }
  body.hide-closed .noterow[data-done="true"], body.hide-closed .filenote[data-done="true"] { display: none; }
  body.hide-closed .noterow[data-done="true"][data-reveal="true"] { display: table-row; }
  body.hide-closed .filenote[data-done="true"][data-reveal="true"] { display: block; }
  body.hide-context tr.c { display: none; }
  body.dragging { user-select: none; cursor: ns-resize; }

  /* The affordance is always in the layout, so revealing it cannot shift the code sideways. */
  .pin {
    width: 15px;
    height: 15px;
    padding: 0;
    border: 0;
    border-radius: 3px;
    background: var(--accent);
    color: var(--surface);
    font: inherit;
    font-size: 11px;
    line-height: 15px;
    text-align: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.08s ease;
  }
  tr:hover .pin, .pin.held { opacity: 1; pointer-events: auto; }
  .pin:focus-visible { opacity: 1; pointer-events: auto; outline: 2px solid var(--accent); outline-offset: 1px; }

  /* The table is as wide as its widest line, so a comment left to that width puts everything after its text - the
     chip that unfolds it, the buttons - beyond the right edge, unreachable and never clipped. Pinned to the left of
     the scrolling body and sized to what is actually visible, measured on the body itself. */
  .filenote { padding: 0 0 0 0; background: var(--surface-sunk); border-bottom: 1px solid var(--rule); }
  .filenote.writing { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px 10px; border-left: 3px solid var(--accent); }
  .filenote.writing textarea { font: inherit; font-family: var(--sans); font-size: 12.5px; min-height: 52px; padding: 7px 8px; color: var(--ink); background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px; resize: vertical; }
  .filenote.writing .row { display: flex; align-items: center; gap: 8px; }

  .noterow td { padding: 0; background: var(--surface-sunk); }
  /* Held at the left of what is on screen and sized to it. Sticky would say this, but a sticky box inside a table cell
     is not honoured everywhere, so the offset is taken from the body's own scrolling instead. */
  .noterow td > * {
    position: relative;
    z-index: 1;
    width: var(--seen, 100%);
    box-sizing: border-box;
    transform: translateX(var(--slid, 0px));
  }
  .notebox { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px 10px; border-left: 3px solid var(--accent); }
  .notebox textarea, .tray textarea, .thread .actions textarea {
    font: inherit;
    font-family: var(--sans);
    font-size: 12.5px;
    min-height: 52px;
    padding: 7px 8px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 6px;
    resize: vertical;
  }
  .notebox .row { display: flex; align-items: center; gap: 8px; }
  button.solid, button.ghost {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border: 1px solid transparent;

  .thread {

  let heard = {};

  const els = {};
  for (const id of ["tabs", "scope", "q", "ctx", "hidedone", "hideclosed", "filelist", "main", "tplus", "tminus", "pfill", "ptext", "pback", "pnext", "tray", "traycount", "traylist", "traynote", "traysend", "traydrop", "tograb", "togh", "ghlabel", "trayresult", "logopen", "log", "logcount", "logrows", "logsort", "logretry", "logbind", "logsend", "logsync", "logclose", "logresult", "logresolved", "brand", "repo", "source", "sourceopen", "srcdir", "srcbase", "srcfilter", "srcrefs", "srcpulls", "srcscan", "srcstatus", "moved", "goto", "veil", "palette", "pq", "picks", "toast", "toastwhere", "toastsaid", "toastmark", "logdot"]) {
    els[id] = document.getElementById(id);
  }

  function showSource() {
    els.repo.textContent = data.name || "";
    // The base and the moment this page was built are worth having, not worth a line of the bar: they live in the title.
    els.brand.title = `base ${data.baseRef} at ${data.base} \u00b7 ${els.brand.dataset.built}`;
    els.srcdir.value = data.root || "";
    els.srcbase.value = data.baseRef || "upstream/main";
  }

  const branch = () => data.branches[state.branch];
  const stamp = () => new Date().toISOString();
  // A review is the pull request it belongs to, whatever ref it is read from: the branch, the head fetched by number,
  // or the number typed in. Keyed to the ref instead, comments and ticks vanish the moment the same work is opened
  // another way.
  const review = () => (branch().pr ? `#${branch().pr.number}` : branch().ref);

  const aliases = () => {
    const names = [branch().ref, review()];
    if (branch().pr) names.push(`refs/diffdesk/pull/${branch().pr.number}`, `#${branch().pr.number}`);
    return names;
  };

  const belongs = (note) => note.review === review() || aliases().includes(note.branch);

  const key = (path) => `${review()} ${path}`;

  // Every name this review's ticks may be filed under, its own first. Read under another name earlier - a bare ref,
  // before the pull request was known - a file leaves a tick there, and that older tick must not outrank what the
  // reader has done since, or the file reads as changed since review however often they tick it.
  const marksFor = (path) => [key(path), ...aliases().map((name) => `${name} ${path}`)];

  /* ---------- reviewed state, remembered and invalidated by digest ---------- */

  function loadFolded() {
    try {
      folded = new Set(JSON.parse(localStorage.getItem("diffdesk.folded") || "[]"));
    } catch (error) {
      folded = new Set();
    }
  }

  function loadSeen() {
    // The browser's copy, which is what a desk that cannot be reached leaves the reader reading against.
    try {
      seen = JSON.parse(localStorage.getItem("diffdesk.seen") || "{}");
    } catch (error) {
      seen = {};
    }
  }

  async function takeSeen() {
    // The desk holds the ticks, so they outlive this browser, its profile, and the address the page was opened at. What
    // it holds wins; what only this browser holds is sent up, which is how a reader who ticked offline keeps it.
    try {
      const response = await fetch("reviewed", { cache: "no-store" });
      if (!response.ok) throw new Error("no endpoint");
      const held = (await response.json()).marks || {};
      const mine = Object.fromEntries(Object.entries(seen).filter(([mark]) => !(mark in held)));
      seen = { ...seen, ...held };
      saveSeen();
      if (Object.keys(mine).length) post("reviewed", { marks: mine });
    } catch (error) {
      notes.live = false;
    }
  }

  function saveSeen() {
    localStorage.setItem("diffdesk.seen", JSON.stringify(seen));
  }

  function seenState(file) {
    const mark = marksFor(file.path)
      .map((name) => seen[name])
      .find(Boolean);
    if (!mark) return "open";
    return mark === file.digest ? "done" : "stale";
  }

  function setSeen(file, done) {
    // Whatever name the file was ticked under before, this settles it: the older ones go and the review's own is what
    // is written, so the tick the reader just made is the one that answers for the file.
    const held = marksFor(file.path);
    for (const name of held) delete seen[name];
    if (done) seen[key(file.path)] = file.digest;
    saveSeen();
    post("reviewed", { drop: held, marks: done ? { [key(file.path)]: file.digest } : {} });
  }

  function countStale(files) {
    // The tick is kept, not dropped: it is the record that this file was read once, and the reader is the one who
    // decides it has been read again. Deleting it made the whole review look untouched the moment a diff moved on.
    return files.filter((file) => seenState(file) === "stale").length;
  }

  /* ---------- code, read as code ---------- */

  // The language a file is read as, by the name it carries. Highlight.js knows a great many; these are the ones a
  // review of this kind holds, and a name that names none is left alone - a diff coloured as the wrong language reads
  // worse than a diff not coloured at all.
  const TONGUE_OF = {
    py: "python", pyi: "python", pyx: "python",
    js: "javascript", mjs: "javascript", cjs: "javascript", jsx: "javascript",
    ts: "typescript", tsx: "typescript",
    c: "c", h: "c", cc: "cpp", cpp: "cpp", cxx: "cpp", hpp: "cpp", cu: "cpp", cuh: "cpp", metal: "cpp", glsl: "cpp",
    m: "objectivec", mm: "objectivec", rs: "rust", go: "go", java: "java", kt: "kotlin", swift: "swift", cs: "csharp",
    rb: "ruby", php: "php", lua: "lua", pl: "perl", r: "r", jl: "julia", scala: "scala", dart: "dart",
    sh: "bash", bash: "bash", zsh: "bash", fish: "bash",
    yml: "yaml", yaml: "yaml", toml: "ini", ini: "ini", cfg: "ini", conf: "ini",
    json: "json", xml: "xml", html: "xml", svg: "xml", css: "css", scss: "scss", less: "less",
    md: "markdown", rst: "plaintext", sql: "sql", dockerfile: "dockerfile", mk: "makefile", cmake: "cmake",
  };

  const tongueFor = (path) => {
    const name = path.split("/").pop().toLowerCase();
    if (name === "dockerfile") return "dockerfile";
    if (name === "makefile") return "makefile";
    return TONGUE_OF[name.includes(".") ? name.split(".").pop() : ""];
  };

  function splitPainted(html) {
    // Highlight.js colours a block, and one of its spans may cross a line - a docstring, a comment, a template string.
    // Each line is closed at its end and whatever was open reopened at the start of the next, so a row can be shown on
    // its own and still read as part of what it belongs to.
    const lines = [];
    const open = [];
    let line = "";
    let at = 0;
    while (at < html.length) {
      const next = html.indexOf("<", at);
      const said = html.slice(at, next === -1 ? html.length : next);
      said.split("\n").forEach((part, index) => {
        if (index) {
          lines.push(line + "</span>".repeat(open.length));
          line = open.join("");
        }
        line += part;
      });
      if (next === -1) break;
      const shut = html.indexOf(">", next);
      const tag = html.slice(next, shut + 1);
      if (tag.startsWith("</")) open.pop();
      else open.push(tag);
      line += tag;
      at = shut + 1;
    }
    lines.push(line + "</span>".repeat(open.length));
    return lines;
  }

  function paintFile(file, tongue) {
    // What each row of the file reads as, by its place in the lines the card holds. One call per side of a hunk rather
    // than one per row: a string opened on one line and closed on another is then coloured whole. Per hunk, because the
    // lines a hunk does not show would otherwise carry their state across the gap; per side, because the old lines and
    // the new ones are two different texts, which is exactly what a unified diff interleaves.
    const painted = new Map();
    if (!tongue || !window.hljs) return painted;
    const sides = [[], []];
    const flush = () => {
      for (const rows of sides) {
        if (rows.length) {
          const said = rows.map((row) => row.text).join("\n");
          const parts = splitPainted(hljs.highlight(said, { language: tongue, ignoreIllegals: true }).value);
          rows.forEach((row, index) => painted.set(row.at, parts[index]));
          rows.length = 0;
        }
      }
    };
    file.lines.forEach(([kind, , , text], at) => {
      if (kind === "h") {
        flush();
        return;
      }
      // A context line belongs to both texts, and reads the same in either, so the new side is the one shown.
      if (kind === "d" || kind === "c") sides[0].push({ at, text });
      if (kind === "a" || kind === "c") sides[1].push({ at, text });
    });
    flush();
    return painted;
  }

  /* ---------- comments ---------- */

  async function post(route, payload) {
    try {
      const answer = await fetch(route, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      return await answer.json();
    } catch (error) {
      notes.live = false;
      return { ok: false, error: error.message };
    }
  }

  function goTo(said) {
    const wanted = Number.parseInt(String(said).replace(/^#/, ""), 10);
    const note = Number.isNaN(wanted) ? null : mine().find((row) => row.seq === wanted);
    if (!note) {
      els.goto.classList.add("lost");
      window.setTimeout(() => els.goto.classList.remove("lost"), 900);
      return false;
    }
    // Resolved and folded away, or in a file marked reviewed: reach() shows whatever it takes to read the thread.
    if (note.state === "resolved") {
      tucked.delete(note.seq);
      keepTucked();
    }
    render();
    reach(note);
    els.goto.value = "";
    els.goto.blur();
    return true;
  }

  async function watchBranch() {
    // Offered rather than taken: rebuilding the diff under the reader moves the ground they are on, so when the branch
    // has moved on - a commit, a fixup, work saved on disk - the page says so and waits to be asked.
    try {
      const answer = await fetch("state", { cache: "no-store" });
      if (!answer.ok) return;
      const { stamp } = await answer.json();
      if (stamp && data.stamp) els.moved.disabled = stamp === data.stamp;
    } catch (error) {
      // Nothing is serving, which the comments already say.
    }
  }

  async function loadNotes() {
    try {
      const response = await fetch("comments", { cache: "no-store" });
      if (!response.ok) throw new Error("no endpoint");
      notes.sent = await response.json();
      notes.live = true;
    } catch (error) {
      notes.live = false;
      try {
        notes.sent = JSON.parse(localStorage.getItem("diffdesk.notes") || "[]");
      } catch (parseError) {
        notes.sent = [];
      }
    }
  }

  function showStatus(staleCount) {
    const bits = [];
    const rows = mine();
    const closed = rows.filter((note) => note.state === "resolved").length;
    const owed = rows.filter((note) => OWED.includes(note.github)).length;
    // A native tooltip is plain text, so the count stands on its own rather than being marked up.
    if (rows.length) bits.push(`${rows.length} comment${rows.length === 1 ? "" : "s"}, ${closed} resolved`);
    if (owed) bits.push(`${owed} waiting for GitHub`);
    bits.push(notes.live ? "watched by Claude" : "kept in this browser");
    if (staleCount) bits.push(`${staleCount} reopened`);
    els.logopen.title = bits.join(" \u00b7 ");
  }

  const span = (note) =>
    note.side === "file"
      ? "the file"
      : note.endLine && note.endLine !== note.line
        ? `L${note.line}\u2013${note.endLine}`
        : `L${note.line}`;

  const OWED = ["pending", "failed"];

  // Who GitHub takes the reader for, so a remark or a reply they wrote over there is not read back at them as a login.
  const mine_ = () => data.viewer || "";
  const isReader = (who) => who === "you" || (Boolean(mine_()) && who === mine_());
  const spokenBy = (who) => (isReader(who) ? "you" : who === "session" ? "claude" : who);

  const saidWhen = (when, who) => {
    const from = who && who !== "you" && who !== "session" ? "submitted on the pull request" : "submitted here";
    return when ? `${said(when)}, ${from}` : from;
  };

  function said(when) {
    // A stamp is a stamp however it was written down: a date is said to the minute, and a bare clock time - all an
    // older log kept of what was written here - stands as the only thing it knows.
    if (/^\d{1,2}:\d{2}/.test(when)) return when;
    const at = new Date(when);
    if (Number.isNaN(at.getTime())) return when;
    const pad = (number) => String(number).padStart(2, "0");
    return `${at.getFullYear()}-${pad(at.getMonth() + 1)}-${pad(at.getDate())} ${pad(at.getHours())}:${pad(at.getMinutes())}`;
  }

  function owedThere(note) {
    if (note.pending || !notes.live) return "";
    const said = (note.replies || []).filter((answer) => answer.github !== "posted").length;
    const owes = [];
    if (note.github !== "posted") owes.push("the remark");
    if (said) owes.push(`${said} repl${said === 1 ? "y" : "ies"}`);
    if (note.state === "resolved" && note.prResolve !== "done") owes.push("its resolution");
    return owes.join(" and ");
  }

  // Which review a request is about. One log holds every review this desk has served, so naming the pull request and
  // the branch is what keeps a sweep for one review off another review's comments.
  const where = () => ({
    repo: data.upstream,
    pr: branch().pr ? branch().pr.number : null,
    branch: branch().ref,
    review: review(),
    resolved: withResolved(),
  });

  // What the pull request holds about a comment, kept apart from what this desk holds: closing one here does not close
  // it there until GitHub says so.
  const PR_RESOLVE = { pending: "not resolved there yet", failed: "not resolved there", done: "resolved there" };

  function closing(note) {
    if (note.github !== "posted") return "";
    if (note.prResolve === "done") return PR_RESOLVE.done;
    // Read from the state, not from the moment it was closed: one closed before this desk tracked the pull request's
    // own threads still owes a resolution there, and saying nothing would let the two disagree unnoticed.
    if (note.state === "resolved") return PR_RESOLVE[note.prResolve] || PR_RESOLVE.pending;
    return PR_RESOLVE[note.prResolve] || "";
  }

  /* ---------- the log: what is waiting, what is on the PR, what is local only, what has moved on ---------- */

  function present() {
    // Every line the current view can anchor a comment to, so a comment that no longer has one can be told apart.
    const keys = new Set();
    for (const file of view().files) {
      for (const [kind, oldNo, newNo] of file.lines) {
        if (kind === "h") continue;
        keys.add(`${file.path}|${kind === "d" ? "old" : "new"}|${kind === "d" ? oldNo : newNo}`);
      }
    }
    return keys;
  }

  // A remark about a whole file has no line to lose, so it is never left behind by one. Otherwise a comment is left
  // behind when the line it was written against is gone from the diff, whether or not its number still names one.
  const isOutdated = (note, keys) =>
    note.side !== "file" && (!keys.has(`${note.path}|${note.side}|${placed(note)}`) || lostItsLine(note));

  function mine() {
    return notes.sent.filter((note) => belongs(note) && note.path !== "(review)" && note.state !== "deleted");
  }

  const withResolved = () => els.logresolved.checked;

  // The newest comment this page knows of, which is what a fold decision is taken against.
  const latest = () => Math.max(0, ...notes.sent.map((note) => note.seq));

  function markRead(path) {
    for (const note of mine()) {
      if (note.path === path) heard[note.seq] = (note.replies || []).length;
    }
    keepHeard();
  }

  function drawLog() {
    const keys = present();
    const all = mine();
    const rows = withResolved() ? all : all.filter((note) => note.state !== "resolved");
    const owed = rows.filter((note) => OWED.includes(note.github));
    const counted = [
      `${all.filter((note) => note.state === "open").length} open`,
      `${all.filter((note) => note.state === "resolved").length} resolved`,
    ];
    if (owed.length) counted.push(`${owed.length} waiting for GitHub`);
    const posted = rows.filter((note) => note.github === "posted").length;
    if (posted) counted.push(`${posted} on the PR`);
    els.logcount.textContent = counted.join(" \u00b7 ");
    // Always in the layout, so saying that something is waiting cannot move the button it is said on.
    els.logdot.dataset.on = String(owed.length > 0);
    const local = rows.filter((note) => note.github === "none");
    els.logretry.disabled = !owed.length;
    els.logbind.disabled = !local.length || !branch().pr;
    els.logsync.disabled = !branch().pr;
    els.logsend.disabled = !branch().pr || !alreadyThere().length;

    els.logrows.innerHTML = "";
    if (els.logsort.value === "recent") {
      // Most recently touched first, threads and their replies together: a reply carries no batch of its own, so this
      // is where the answer just written into a batch of long ago is found.
      const moved = [...rows].sort((one, other) => (other.event || 0) - (one.event || 0));
      for (const note of moved) els.logrows.append(logRow(note, keys));
      if (!moved.length) drawEmpty(all);
      return;
    }
    const batches = new Map();
    for (const note of rows) {
      if (!batches.has(note.batch)) batches.set(note.batch, []);
      batches.get(note.batch).push(note);
    }
    for (const [id, held] of batches) {
      const group = document.createElement("div");
      group.className = "batch";
      const title = document.createElement("div");
      title.className = "batchhead";
      const name = document.createElement("b");
      name.textContent = id ? `batch ${id}` : "earlier";
      const size = document.createElement("span");
      size.className = "said";
      size.textContent = `${held.length} comment${held.length === 1 ? "" : "s"}`;
      title.append(name, size);
      group.append(title);
      els.logrows.append(group);
      for (const note of held) group.append(logRow(note, keys));
    }
    if (!rows.length) drawEmpty(all);
  }

  function drawEmpty(all) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = all.length ? "Nothing open: all of it is resolved." : "No comments on this branch yet.";
    els.logrows.append(empty);
  }

  function reach(note) {
    const card = document.querySelector(`section.file[data-path="${CSS.escape(note.path)}"]`);
    if (!card) return;
    // A file folded away, or hidden because it is reviewed, still holds the comment: it is opened and shown for this.
    card.dataset.open = "true";
    card.dataset.reveal = "true";
    folds.set(note.path, { digest: card.dataset.digest, open: true, upTo: latest() });
    els.log.dataset.open = "false";
    // The lines of a file the reader was nowhere near are built for this, since the thread hangs among them - built
    // outright rather than settled, which would leave a file they are nowhere near exactly as it was.
    const held = drawn.get(card);
    if (held) fillBody(card, held.file, held.index);
    // A remark about the file as a whole hangs under its header rather than on a row, so it is found by the seq it
    // carries either way.
    const thread =
      document.getElementById(`note-${note.seq}`) ||
      document.querySelector(`.filenote[data-seq="${note.seq}"]`) ||
      card;
    reaching = { card, thread };
    // Resolved and hidden away, it is still the thread being reached for, so it is shown, as a folded file is opened.
    if (thread !== card) thread.dataset.reveal = "true";
    for (const found of document.querySelectorAll(".thread.found")) found.classList.remove("found");
    const box = thread.querySelector ? thread.querySelector(".thread") : null;
    if (box) {
      box.classList.add("found");
      window.setTimeout(() => box.classList.remove("found"), 1600);
    }
    // Unfolding the card moves everything below it, so the scroll waits for that layout: aiming before it lands with
    // the thread off screen. Where it is aimed is worked out here rather than left to the browser, which centres on the
    // whole window and so can leave the thread under the page header - and answers differently from engine to engine.
    //
    // Aimed again until it lands: going there brings other files within reach, and a file built on arrival stands at
    // what its lines measure rather than at what was reserved for them, which moves the thread from under the aim.
    aim(thread, 6);
  }

  function aim(thread, tries, again) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const box = thread.getBoundingClientRect();
      const covered = document.querySelector("header").getBoundingClientRect().bottom;
      const room = window.innerHeight - covered;
      const middle = Math.max(0, (room - box.height) / 2);
      const off = box.top - covered - middle;
      if (tries <= 0) {
        reaching = null;
        return;
      }
      // Landed is landed and still there a frame later: a file built because the aim brought it within reach is
      // measured after that aim, and what its lines turn out to take moves the thread from under where it landed.
      if (Math.abs(off) < 2) {
        if (again) reaching = null;
        else aim(thread, tries - 1, true);
        return;
      }
      // Told to go there outright once the first aim has been taken: a smooth scroll still on its way answers with
      // where it is rather than where it is going, and every aim after the first would read that as a miss.
      window.scrollTo({ top: Math.max(0, window.scrollY + off), behavior: tries === 6 ? "smooth" : "auto" });
      aim(thread, tries - 1, false);
    }));
  }

  const alreadyThere = () => mine().filter((note) => note.github === "posted" && owedThere(note));

  async function sendThreads(held) {
    const request = branch().pr;
    if (!request || !held.length) return;
    els.logresult.textContent = `Sending ${held.length} thread(s) to PR #${request.number}...`;
    let sent = 0;
    let refused = "";
    for (const note of held) {
      const outcome = await post("send", { seq: note.seq, ...where() });
      if (outcome.ok) sent += 1;
      else refused = refused || outcome.error || "GitHub unreachable";
    }
    els.logresult.textContent = refused
      ? `Sent ${sent} of ${held.length}: ${refused}`
      : `Sent ${sent} thread(s) to PR #${request.number}`;
    if (refused) announce("sync", `PR #${request.number}`, refused);
    await loadNotes();
    drawLog();
    render();
  }

  function logRow(note, keys) {
    const item = document.createElement("button");
    item.className = "logrow";
    item.dataset.state = note.state;
    const where = document.createElement("b");
    where.textContent = `${note.path.split("/").pop()} ${span(note)}`;
    const said = document.createElement("span");
    said.className = "said";
    said.textContent = outline(note.text).slice(0, 90);
    item.append(where, said);
    for (const [label, kind] of [
      [note.github === "none" ? "local only" : GITHUB_MARK[note.github], note.github],
      [closing(note), note.prResolve === "done" ? "posted" : "pending"],
      [isOutdated(note, keys) ? "code moved on" : "", "outdated"],
    ]) {
      if (!label) continue;
      const mark = document.createElement("span");
      mark.className = `mark ${kind}`;
      mark.textContent = label;
      if (note.error && kind === "failed") mark.title = note.error;
      item.append(mark);
    }
    // The thread sent from its own row, since the panel is where a reader works through what is still owed. A span
    // rather than a button: the row is a button itself, and a button inside one is no button at all.
    const owes = owedThere(note);
    if (owes && branch().pr) {
      const out = document.createElement("span");
      out.className = "mark none act";
      out.setAttribute("role", "button");
      out.tabIndex = 0;
      out.textContent = "sync";
      out.title = `Send ${owes} to PR #${branch().pr.number}`;
      const sending = async (event) => {
        event.stopPropagation();
        await sendThreads([note]);
      };
      out.addEventListener("click", sending);
      out.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") sending(event);
      });
      item.append(out);
    }
    item.addEventListener("click", () => reach(note));
    return item;
  }

  function announce(deed, where, reason) {
    // Said where the reader is looking, since what went wrong with GitHub is worth more than a line in a panel they may
    // have closed. It stays until dismissed: a reason worth reading is worth reading at leisure, and the whole of it is
    // held on the row for a reader whose window is too narrow for the line.
    els.toastwhere.textContent = where;
    els.toastsaid.textContent = reason;
    els.toastmark.textContent = `${deed} failed`;
    els.toast.title = reason;
    els.toast.dataset.open = "true";
  }

  async function syncThere(loud) {
    // A sync only listens: replies, comments opened there, and the pull request's word on what is resolved, which is
    // the copy everyone else reads. What this desk holds goes out when the reader sends that thread.
    const request = branch().pr;
    if (!request || !notes.live) return;
    if (loud) els.logresult.textContent = `Syncing with PR #${request.number}...`;
    const outcome = await post("sync", where());
    if (loud) {
      els.logresult.textContent = outcome.ok
        ? `Brought back ${outcome.brought} reply(ies), took ${outcome.took} comment(s) in, closed ${outcome.closed} here`
        : `Could not sync: ${outcome.error || "GitHub unreachable"}`;
    }
    if (!outcome.ok) announce("sync", `PR #${request.number}`, outcome.error || "GitHub unreachable");
    await loadNotes();
    drawLog();
    render();
  }

  async function retryOwed(loud) {
    const owed = mine().filter((note) => OWED.includes(note.github));
    const request = branch().pr;
    if (!owed.length || !request || !notes.live) {
      if (loud) els.logresult.textContent = request ? "Nothing is waiting." : "This branch has no pull request.";
      return;
    }
    els.logresult.textContent = `Sending ${owed.length} to PR #${request.number}...`;
    const outcome = await post("publish", { ...where(), seq: owed.map((note) => note.seq) });
    els.logresult.textContent = outcome.ok
      ? `Sent ${outcome.sent} to PR #${request.number}`
      : `Still waiting: ${outcome.error || "GitHub unreachable"}`;
    if (!outcome.ok) {
      announce("send", `PR #${request.number}`, outcome.error || "GitHub unreachable");
    }
    await loadNotes();
    drawLog();
    render();
  }

  // Watching the threads on screen, so a reply counts as read when it has been in front of the reader.
  const noticed = new IntersectionObserver(
    (entries) => {
      let learned = false;
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        const seq = Number(entry.target.dataset.seq);
        const answers = Number(entry.target.dataset.answers);
        if (heard[seq] !== answers) {
          heard[seq] = answers;
          learned = true;
        }
        noticed.unobserve(entry.target);
      }
      if (!learned) return;
      keepHeard();
    },
    { threshold: 0.4 },
  );

  function grows(box) {
    // A box the size of what has been written into it: measured after it is in the page, since a box not yet there has
    // nothing to measure, and bounded so a long remark scrolls inside it rather than pushing the diff off screen.
    const fit = () => {
      box.style.height = "auto";
      box.style.height = `${Math.min(box.scrollHeight, Math.round(window.innerHeight * 0.45))}px`;
    };
    box.addEventListener("input", fit);
    requestAnimationFrame(fit);
  }

  function keepDrafts() {
    // Written wherever the tray changes: a comment waiting to be sent is work that has been done, and a reload, a
    // refresh, or a browser closed on it must not be what throws it away.
    try {
      localStorage.setItem("diffdesk.drafts", JSON.stringify({ review: review(), note: els.traynote.value, held: notes.drafts }));
    } catch (error) {
      // A storage that refuses to be written is one the reader will notice on their own.
    }
  }

  function takeHeard() {
    try {
      heard = JSON.parse(localStorage.getItem("diffdesk.heard") || "{}");
    } catch (error) {
      heard = {};
    }
  }

  function keepHeard() {
    try {
      localStorage.setItem("diffdesk.heard", JSON.stringify(heard));
    } catch (error) {
      // A storage that refuses to be written costs the reader a thread, or a file, opening itself once more.
    }
  }

  function takeTucked() {
    try {
      tucked = new Set(JSON.parse(localStorage.getItem("diffdesk.tucked") || "[]"));
    } catch (error) {
      tucked = new Set();
    }
  }

  function keepTucked() {
    try {
      localStorage.setItem("diffdesk.tucked", JSON.stringify([...tucked]));
    } catch (error) {
      // A storage that refuses to be written costs the reader the folds they made, once they reload.
    }
  }

  function takeDrafts() {
    try {
      const kept = JSON.parse(localStorage.getItem("diffdesk.drafts") || "null");
      // Only this review's: the drafts of another branch belong to it, not to whatever is being read now.
      if (kept && kept.review === review()) {
        notes.drafts = kept.held || [];
        els.traynote.value = kept.note || "";
      }
    } catch (error) {
      notes.drafts = [];
    }
  }

  function drawTray() {
    keepDrafts();
    const request = branch().pr;
    els.tograb.hidden = !(request && notes.live);
    els.ghlabel.textContent = request ? `Also post to PR #${request.number}` : "";
    els.tray.dataset.open = String(notes.drafts.length > 0);
    els.traycount.textContent = `${notes.drafts.length} comment${notes.drafts.length === 1 ? "" : "s"} pending`;
    els.traylist.innerHTML = "";
    for (const draft of notes.drafts) {
      const item = document.createElement("li");
      const where = document.createElement("b");
      where.textContent = `${draft.path.split("/").pop()} ${span(draft)}`;
      const said = document.createElement("span");
      said.className = "said";
      said.textContent = ` ${outline(draft.text).slice(0, 70)}`;
      const alone = document.createElement("button");
      alone.className = "tiny";
      alone.textContent = "Send";
      alone.title = "Send this one now and keep the rest pending";
      alone.addEventListener("click", () => sendAll([draft], ""));
      item.append(where, said, alone);
      els.traylist.append(item);
    }
  }

  async function sendAll(drafts, summary) {
    if (!drafts.length) return;
    const bound = els.togh.checked && Boolean(branch().pr);
    const batch = [...drafts];
    if (summary) {
      batch.push({ branch: branch().ref, review: review(), path: "(review)", line: 0, side: "new", text: summary, at: stamp() });
    }
    let recorded = null;
    if (notes.live) recorded = await post("comments", { comments: batch, github: bound });
    // Written by the reader, so read by the reader: what shows itself later is what somebody else said.
    if (recorded && recorded.ok) {
      for (const seq of recorded.seqs) heard[seq] = 0;
      keepHeard();
    }
    if (bound && recorded && recorded.ok) {
      els.trayresult.textContent = `Posting ${batch.length} to PR #${branch().pr.number}...`;
      const outcome = await post("publish", { ...where(), summary, seq: recorded.seqs });
      // A post that does not land leaves the comments waiting rather than losing them; the log says so and retries.
      els.trayresult.textContent = outcome.ok
        ? `Posted to PR #${branch().pr.number}`
        : `GitHub did not take it, kept waiting: ${outcome.error || "unreachable"}`;
    }
    if (!notes.live) {
      notes.sent.push(...batch);
      localStorage.setItem("diffdesk.notes", JSON.stringify(notes.sent));
    }
    notes.drafts = notes.drafts.filter((draft) => !drafts.includes(draft));
    if (summary) els.traynote.value = "";
    await loadNotes();
    drawTray();
    drawLog();
    render();
  }

  async function submitReview() {
    await sendAll(notes.drafts, els.traynote.value.trim());
  }

  const send1 = (note) => sendAll([note], "");

  function notesAt(path, line, side) {
    const hit = (note) =>
      belongs(note) && note.state !== "deleted" && note.path === path && note.side === side && placed(note) === line;
    return [...notes.sent.filter(hit), ...notes.drafts.filter(hit).map((draft) => ({ ...draft, pending: true }))];
  }

  // Where a comment now belongs. A diff that changes under a comment leaves its line number pointing at whatever took
  // that place, so the text the comment was written against is what places it: found once, that line is where it goes;
  // found several times, the one nearest where it was; found nowhere, its line stands and it is said to have lost it.
  function codeAt(path, line, side) {
    const file = view().files.find((entry) => entry.path === path);
    if (!file) return "";
    const row = file.lines.find(
      (entry) => entry[0] !== "h" && (entry[0] === "d" ? "old" : "new") === side && (entry[0] === "d" ? entry[1] : entry[2]) === line,
    );
    return row ? row[3] : "";
  }

  function placed(note) {
    const wanted = note.endLine || note.line;
    if (!note.anchor) return wanted;
    const file = view().files.find((entry) => entry.path === note.path);
    if (!file) return wanted;
    const rows = file.lines.filter((row) => row[0] !== "h" && (row[0] === "d" ? "old" : "new") === note.side);
    if (rows.some((row) => (row[0] === "d" ? row[1] : row[2]) === wanted && row[3] === note.anchor)) return wanted;
    const same = rows.filter((row) => row[3] === note.anchor).map((row) => (row[0] === "d" ? row[1] : row[2]));
    if (!same.length) return wanted;
    // The same line can read the same in several places, and the one the comment was written against is the one it was
    // nearest to.
    return same.reduce((best, line) => (Math.abs(line - wanted) < Math.abs(best - wanted) ? line : best));
  }

  // Whether the line a comment was written against is still in the diff. A remark about a whole file has no line to
  // lose; one whose text is nowhere to be found has lost its place even though its number still names some other line,
  // which is the case a number alone cannot tell.
  function lostItsLine(note) {
    if (note.side === "file") return false;
    const file = view().files.find((entry) => entry.path === note.path);
    if (!file) return true;
    if (!note.anchor) return !file.lines.some((row) => row[0] !== "h" && placedLine(row, note.side) === placed(note));
    return !file.lines.some((row) => row[0] !== "h" && row[3] === note.anchor && rowSide(row) === note.side);
  }

  const rowSide = (row) => (row[0] === "d" ? "old" : "new");
  const placedLine = (row, side) => (side === "old" ? row[1] : row[2]);

  const GITHUB_MARK = {
    pending: "waiting for GitHub",
    failed: "GitHub post failed",
    refused: "GitHub refused it",
    posted: "on the PR",
  };

  // A badge, a subscript, a line break: the little that carries no meaning of its own in what a pull request holds.
  // Anything else stays as it was typed, since a passage somebody pasted is read as the passage they pasted.
  const spoken = (text) =>
    String(text)
      .replace(/<br\s*\/?>/gi, "\n")
      .replace(/<img[^>]*\balt="([^"]*)"[^>]*>/gi, "$1")
      .replace(/<\/?(?:sub|sup)\s*\/?>/gi, "");

  function phrase(into, text) {
    // Bold as bold, a link as a link, and a badge as the word it stands for: assembled as nodes, so nothing said on a
    // pull request can become part of this page.
    for (const piece of text.split(/(!?\[[^\]\n]*\]\([^)\s]+\)|\*\*[^*\n]+\*\*)/)) {
      if (!piece) continue;
      const badge = piece.match(/^!\[([^\]\n]*)\]\([^)\s]+\)$/);
      const link = piece.match(/^\[([^\]\n]*)\]\(([^)\s]+)\)$/);
      const bold = piece.match(/^\*\*([^*\n]+)\*\*$/);
      if (badge) {
        const word = badge[1].replace(/\s*badge$/i, "").trim();
        if (word) into.append(document.createTextNode(word));
      } else if (link) {
        const anchor = document.createElement("a");
        anchor.href = /^https?:\/\//i.test(link[2]) ? link[2] : "#";
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        anchor.textContent = link[1] || link[2];
        into.append(anchor);
      } else if (bold) {
        // Read on: a heading from a pull request carries its badge inside the bold rather than beside it.
        const strong = document.createElement("strong");
        phrase(strong, bold[1]);
        into.append(strong);
      } else {
        into.append(document.createTextNode(piece));
      }
    }
  }

  const outline = (text) =>
    spoken(text)
      .replace(/```[a-z0-9+#-]*/gi, " ")
      .replace(/!\[([^\]\n]*)\]\([^)\s]+\)/g, (whole, alt) => alt.replace(/\s*badge$/i, ""))
      .replace(/\[([^\]\n]*)\]\([^)\s]+\)/g, "$1")
      .replace(/\*\*/g, "")
      .replace(/`/g, "")
      .replace(/\s+/g, " ")
      .trim();

  function quotes(chunk) {
    // The chunk in runs of lines, each said to be quoted or not: consecutive quoted lines are one passage, so a
    // paragraph answered line by line reads as the paragraph it is.
    const runs = [];
    for (const line of chunk.split("\n")) {
      const quoted = /^\s*>\s?/.test(line);
      const said = quoted ? line.replace(/^\s*>\s?/, "") : line;
      const last = runs[runs.length - 1];
      if (last && last[0] === quoted) last[1] += `\n${said}`;
      else runs.push([quoted, said]);
    }
    // The break between a passage and the words around it is the blockquote's own, so it is not kept twice.
    return runs.map(([quoted, said]) => [quoted, quoted ? said : said.replace(/^\n/, "").replace(/\n$/, "")]);
  }

  function written(host, text) {
    // Comments are typed by hand, so the little markdown that carries meaning is honoured: a fenced block stays code
    // with its indentation, backticks stay code, and line breaks stay where they were put. Assembled as nodes rather
    // than as markup, so nothing a reviewer pastes can become part of the page.
    String(text)
      .split("```")
      .forEach((chunk, index) => {
        if (index % 2) {
          const block = document.createElement("pre");
          const code = document.createElement("code");
          const lines = chunk.replace(/^\n/, "").split("\n");
          // A fence carries its language on the opening line, which is a label rather than part of the code.
          if (lines.length > 1 && lines[0].trim() && !/\s/.test(lines[0].trim())) lines.shift();
          code.textContent = lines.join("\n").replace(/\n+$/, "");
          block.append(code);
          host.append(block);
          return;
        }
        // A run of quoted lines is what a reply looks like when it answers a passage: shown as the passage it quotes,
        // set apart from the words answering it, rather than as the marks that were typed.
        for (const [quoted, part] of quotes(spoken(chunk))) {
          const into = quoted ? host.appendChild(document.createElement("blockquote")) : host;
          for (const piece of part.split(/(`[^`\n]+`)/)) {
            if (!piece) continue;
            if (piece.length > 2 && piece.startsWith("`") && piece.endsWith("`")) {
              const code = document.createElement("code");
              code.textContent = piece.slice(1, -1);
              into.append(code);
            } else {
              phrase(into, piece);
            }
          }
        }
      });
    return host;
  }

  const spoke = () => {
    const said = document.createElement("span");
    said.className = "text";
    return said;
  };

  function noteRow(note) {
    const row = document.createElement("tr");
    row.className = "noterow";
    row.id = `note-${note.seq || "draft"}`;
    const cell = document.createElement("td");
    cell.colSpan = 5;
    const answers = (note.replies || []).length;
    // Folded where the reader folded it, and only once they have been shown all of it: a thread answered since they
    // read it is news, and news is read rather than outlined.
    const read = note.seq in heard && answers <= heard[note.seq];
    const settled = note.state === "resolved" && tucked.has(note.seq) && read;
    const box = document.createElement("div");
    box.className = note.pending ? "thread draft" : note.state === "resolved" ? "thread done" : "thread";
    // What the reader has been shown is what has been on their screen: rendering it is not reading it, and a thread
    // built inside a folded file or below the fold would otherwise count as read without ever being seen.
    if (!note.pending && !settled) {
      box.dataset.seq = note.seq;
      box.dataset.answers = answers;
      noticed.observe(box);
    }
    if (note.outdated) box.classList.add("stale");
    if (settled) box.classList.add("folded");
    if (note.state === "resolved") row.dataset.done = "true";

    const head = document.createElement("div");
    head.className = "line";
    const who = document.createElement("span");
    who.className = "who";
    // The number a session refers to a comment by, right where the comment is: "[58]" in an answer means this thread.
    if (note.pending) {
      who.textContent = `${span(note)} pending`;
    } else {
      const numbered = document.createElement("span");
      numbered.className = "seq";
      numbered.textContent = `[${note.seq}]`;
      const place = document.createElement("span");
      place.className = "at";
      place.textContent = span(note);
      who.append(numbered, document.createTextNode(" "), place);
      // Whose remark it is, said where a reply says whose it is. Where it was written is the one thing left to hovering:
      // a thread reads the same either way, and this desk is where the reader is reading it.
      const from = document.createElement("span");
      from.className = `by ${note.who ? (isReader(note.who) ? "you" : "them") : "you"}`;
      from.textContent = note.who ? spokenBy(note.who) : "you";
      who.append(document.createTextNode(" "), from);
      head.title = saidWhen(note.at, note.who);
    }
    const text = document.createElement("span");
    text.className = "said";
    text.append(who);
    written(text.appendChild(spoke()), note.text);
    head.append(text);
    if (note.state === "resolved") {
      const turn = document.createElement("button");
      turn.className = "tiny";
      turn.textContent = settled ? `resolved${answers ? `, ${answers} repl${answers === 1 ? "y" : "ies"}` : ""}` : "fold";
      turn.title = settled ? "Show the whole thread" : "Fold it away again";
      turn.addEventListener("click", () => {
        if (settled) tucked.delete(note.seq);
        else tucked.add(note.seq);
        keepTucked();
        render();
      });
      head.append(turn);
    }
    if (settled) {
      // Folded: one line about what it is, and its standing. Everything it holds is a click away, never discarded.
      text.textContent = "";
      text.textContent = outline(note.text);
      box.append(head);
      cell.append(box);
      row.append(cell);
      return row;
    }
    if ((note.pending || notes.live) && !note.who) {
      const change = document.createElement("button");
      change.className = "tiny";
      change.textContent = "Edit";
      change.title = note.edits && note.edits.length ? `rewritten ${note.edits.length} time(s)` : "Rewrite this comment";
      change.addEventListener("click", () => {
        const written = document.createElement("textarea");
        written.rows = 2;
        written.value = note.text;
        grows(written);
        const keep = document.createElement("button");
        keep.className = "solid";
        keep.textContent = "Save";
        const drop = document.createElement("button");
        drop.className = "ghost";
        drop.textContent = "Cancel";
        const editing = document.createElement("div");
        editing.className = "line actions";
        editing.append(written, keep, drop);
        head.replaceWith(editing);
        written.focus();
        drop.addEventListener("click", render);
        keep.addEventListener("click", async () => {
          const wanted = written.value.trim();
          if (!wanted || wanted === note.text) return render();
          if (note.pending) {
            // A draft is only in the page, so rewriting it is rewriting the draft itself.
            if (note.source) note.source.text = wanted;
            drawTray();
          } else {
            await post("edit", { seq: note.seq, text: wanted });
            await loadNotes();
          }
          drawLog();
          render();
        });
      });
      head.append(change);
    }
    if (!note.pending && note.editedAfterPost) {
      const mark = document.createElement("span");
      mark.className = "mark outdated";
      mark.textContent = "rewritten after posting";
      head.append(mark);
    }
    if (note.outdated) {
      const mark = document.createElement("span");
      mark.className = "mark outdated";
      mark.textContent = "code moved on";
      mark.title = `${note.path} ${span(note)} is no longer in this diff`;
      head.append(mark);
    }
    if (!note.pending) {
      const there = closing(note);
      if (there) {
        const mark = document.createElement("span");
        mark.className = `mark ${note.prResolve === "done" ? "posted" : "pending"}`;
        mark.textContent = there;
        if (note.prResolveError) mark.title = note.prResolveError;
        head.append(mark);
      }
      const mark = document.createElement(note.github === "posted" || !notes.live ? "span" : "button");
      mark.className = mark.tagName === "BUTTON" ? `mark ${note.github} act` : `mark ${note.github}`;
      mark.textContent = note.github === "none" ? "local only" : GITHUB_MARK[note.github] || note.github;
      mark.title =
        note.reviewUrl ||
        note.error ||
        (note.github === "none" ? "Send this one to the pull request" : "Keep this one out of the pull request");
      if (mark.tagName === "BUTTON") {
        mark.addEventListener("click", async () => {
          await post("bind", { seq: [note.seq], github: note.github === "none", ...where() });
          await loadNotes();
          if (note.github === "none") await retryOwed(false);
          drawLog();
          render();
        });
      }
      head.append(mark);
    }
    const drop = document.createElement("button");
    drop.className = "drop";
    drop.textContent = "\u00d7";
    if (note.pending) {
      drop.title = "Remove this comment";
      drop.addEventListener("click", () => {
        notes.drafts = notes.drafts.filter((draft) => draft !== note.source);
        drawTray();
        render();
      });
      head.append(drop);
    } else if (notes.live && !note.who) {
      const posted = note.github === "posted";
      drop.title = posted ? "Delete this comment, here and on the pull request" : "Delete this comment";
      drop.addEventListener("click", async () => {
        const answers = (note.replies || []).length;
        const also = answers ? ` and ${answers} repl${answers === 1 ? "y" : "ies"}` : "";
        if (!window.confirm(`Delete this comment${also}${posted ? ", on the pull request as well" : ""}?`)) return;
        const outcome = await post("drop", { seq: note.seq, ...where() });
        if (!outcome.ok) window.alert(`It is still there: ${outcome.error || "GitHub unreachable"}`);
        await loadNotes();
        drawLog();
        render();
      });
      head.append(drop);
    }
    box.append(head);

    (note.replies || []).forEach((answer, index, answers) => {
      const said = document.createElement("div");
      // Read as the reader's own where they wrote it, whichever side of the pull request they were on at the time.
      said.className = `line reply ${isReader(answer.who) ? "you" : answer.who}`;
      const from = document.createElement("span");
      from.className = "who";
      from.textContent = spokenBy(answer.who);
      // When it was said and where it stands, kept for the asking: in the line they say little and take the room the
      // reply is read in.
      from.title = saidWhen(answer.at, answer.who);
      const body = document.createElement("span");
      body.className = "said";
      body.append(from);
      written(body.appendChild(spoke()), answer.text);
      said.append(body);
      // Whether the pull request holds this reply, shown on the reply itself: what a thread still owes is what its own
      // Sync would carry, and a reader deciding whether to press it reads that off the replies.
      if (!note.pending && answer.github !== "none") {
        const standing = document.createElement("span");
        standing.className = `mark ${answer.github}`;
        standing.textContent = GITHUB_MARK[answer.github] || answer.github;
        if (answer.error) standing.title = answer.error;
        said.append(standing);
      }
      // Only what was written here can be reworded: a reply carried back from the pull request is its author's word,
      // said on the copy everyone else reads, so this desk shows it and leaves it alone.
      if (!note.pending && notes.live && (isReader(answer.who) || answer.who === "session")) {
        const change = document.createElement("button");
        change.className = "tiny";
        change.textContent = "Edit";
        change.title = answer.edits && answer.edits.length ? `rewritten ${answer.edits.length} time(s)` : "Rewrite this reply";
        change.addEventListener("click", () => {
          const written = document.createElement("textarea");
          written.rows = 2;
          written.value = answer.text;
          grows(written);
          const keep = document.createElement("button");
          keep.className = "solid";
          keep.textContent = "Save";
          const drop = document.createElement("button");
          drop.className = "ghost";
          drop.textContent = "Cancel";
          const editing = document.createElement("div");
          editing.className = "line reply actions";
          editing.append(written, keep, drop);
          said.replaceWith(editing);
          written.focus();
          drop.addEventListener("click", render);
          keep.addEventListener("click", async () => {
            const wanted = written.value.trim();
            if (!wanted || wanted === answer.text) return render();
            await post("edit", { seq: note.seq, reply: index, text: wanted });
            await loadNotes();
            render();
          });
        });
        said.append(change);
      }
      if (answer.editedAfterPost) {
        const mark = document.createElement("span");
        mark.className = "mark outdated";
        mark.textContent = "rewritten after posting";
        said.append(mark);
      }
      // Only the last one can go: deleting further up would leave the answers below it standing against nothing.
      if (!note.pending && notes.live && index === answers.length - 1) {
        const undo = document.createElement("button");
        undo.className = "drop";
        undo.textContent = "\u00d7";
        undo.title = note.github === "posted" ? "Delete this reply, here and on the pull request" : "Delete this reply";
        undo.addEventListener("click", async () => {
          if (!window.confirm("Delete the last reply?")) return;
          const outcome = await post("drop", { seq: note.seq, reply: true, ...where() });
          if (!outcome.ok) window.alert(`It is still there: ${outcome.error || "GitHub unreachable"}`);
          await loadNotes();
          drawLog();
          render();
        });
        said.append(undo);
      }
      box.append(said);
    });

    // A recorded comment can be answered and closed from here; resolving keeps the thread and all of its replies.
    if (!note.pending && notes.live) {
      const actions = document.createElement("div");
      actions.className = "line actions";
      const say = document.createElement("textarea");
      say.rows = 1;
      say.placeholder = note.state === "resolved" ? "Reopen with a reply" : "Reply";
      say.value = writing.get(note.seq) || "";
      say.addEventListener("input", () => writing.set(note.seq, say.value));
      grows(say);
      const send = document.createElement("button");
      send.className = "ghost";
      send.textContent = "Reply";
      send.addEventListener("click", async () => {
        if (!say.value.trim()) return;
        await post("reply", { seq: note.seq, text: say.value.trim(), who: "you" });
        writing.delete(note.seq);
        await loadNotes();
        render();
      });
      const close = document.createElement("button");
      close.className = note.state === "resolved" ? "ghost" : "solid";
      close.textContent = note.state === "resolved" ? "Reopen" : "Resolve";
      close.addEventListener("click", async () => {
        const shutting = note.state !== "resolved";
        await post("resolve", { seq: [note.seq], answer: say.value.trim(), resolved: shutting, who: "you" });
        writing.delete(note.seq);
        await loadNotes();
        if (shutting) {
          // The reader's own hand on it, which is what folds a thread away, and closed by them is read by them: the
          // answer they closed it with is their own words, so it is not what reopens the thread as unread.
          tucked.add(note.seq);
          const kept = mine().find((row) => row.seq === note.seq);
          heard[note.seq] = kept ? (kept.replies || []).length : 0;
          keepHeard();
        } else {
          tucked.delete(note.seq);
        }
        keepTucked();
        render();
      });
      actions.append(say, send, close);
      // What this thread owes the pull request, sent as it now reads. Offered only when there is something to send,
      // which is what makes the button say what pressing it would do.
      const owes = owedThere(note);
      if (owes && branch().pr) {
        const out = document.createElement("button");
        out.className = "ghost";
        out.textContent = "Sync";
        out.title = `Send ${owes} to PR #${branch().pr.number}`;
        out.addEventListener("click", async () => {
          const outcome = await post("send", { seq: note.seq, ...where() });
          if (!outcome.ok) announce("sync", `PR #${branch().pr.number}`, outcome.error || "GitHub unreachable");
          await loadNotes();
          drawLog();
          render();
        });
        actions.append(out);
      }
      box.append(actions);
    }
    cell.append(box);
    row.append(cell);
    return row;
  }

  /* ---------- line selection ---------- */

  function clearSel() {
    sel.path = sel.from = sel.to = null;
    document.querySelectorAll("tr.sel").forEach((row) => row.classList.remove("sel"));
  }

  function selRows() {
    if (sel.path === null) return [];
    const low = Math.min(sel.from, sel.to);
    const high = Math.max(sel.from, sel.to);
    return [...document.querySelectorAll(`tr[data-path="${CSS.escape(sel.path)}"][data-seq]`)].filter((row) => {
      const seq = Number(row.dataset.seq);
      return seq >= low && seq <= high;
    });
  }

  function paintSel() {
    document.querySelectorAll("tr.sel").forEach((row) => row.classList.remove("sel"));
    for (const row of selRows()) row.classList.add("sel");
  }

  function pick(row, extend) {
    const { path } = row.dataset;
    const seq = Number(row.dataset.seq);
    if (extend && sel.path === path) sel.to = seq;
    else Object.assign(sel, { path, from: seq, to: seq });
    paintSel();
  }

  // Dragging over lines selects the range covered, and letting go opens the comment box on it. The row under the
  // pointer is found by position instead of by event target: once a press has begun a text selection, browsers stop
  // retargeting hover events to the elements passing underneath, so a target-based drag never leaves its first line.
  const drag = { on: false, armed: null, ranged: false };

  function rowAt(x, y) {
    const node = document.elementFromPoint(x, y);
    return node && node.closest ? node.closest("tr[data-line]") : null;
  }

  function startDrag(row) {
    drag.on = true;
    drag.ranged = false;
    pick(row, false);
    document.body.classList.add("dragging");
  }

  function endDrag() {
    document.querySelectorAll(".pin.held").forEach((pin) => pin.classList.remove("held"));
    if (!drag.on) return;
    drag.on = false;
    document.body.classList.remove("dragging");
    if (sel.path !== null && sel.from !== sel.to) composeSel();
  }

  function overDrag(x, y) {
    if (!drag.on) return;
    let row = rowAt(x, y);
    if (!row) {
      // The pointer sits over something floating above the lines - the page header, a file name bar - or past the
      // last line. None of that means the range should stop growing, so it takes the nearest line of the same file.
      // Geometry rather than a guessed offset: whatever floats there, the nearest row is still the intended one.
      let gap = Infinity;
      for (const node of document.querySelectorAll(`tr[data-path="${CSS.escape(sel.path)}"][data-seq]`)) {
        const box = node.getBoundingClientRect();
        const away = y < box.top ? box.top - y : Math.max(0, y - box.bottom);
        if (away < gap) {
          gap = away;
          row = node;
        }
      }
    }
    if (!row) return;
    if (row.dataset.path !== sel.path) return;
    const seq = Number(row.dataset.seq);
    if (seq !== sel.to) drag.ranged = true;
    sel.to = seq;
    paintSel();
  }

  // Releasing after a drag leaves a click behind, aimed at the pin or at an ancestor depending on the engine. Left
  // alone it reaches the line handlers and collapses the range to the single line the click landed on.
  document.addEventListener(
    "click",
    (event) => {
      if (!drag.ranged) return;
      drag.ranged = false;
      event.stopPropagation();
      event.preventDefault();
    },
    true,
  );

  const EDGE = 70;

  document.addEventListener("copy", (event) => {
