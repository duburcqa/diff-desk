    // A diff row carries its two line numbers and its marker beside the code, and a selection spanning rows takes all
    // of them, so what lands in an editor is unusable. A copy takes the code alone, one line per row, indentation kept.
    // A selection inside a single line is left exactly as the browser made it.
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || !event.clipboardData) return;
    const holder = document.createElement("div");
    holder.append(selection.getRangeAt(0).cloneContents());
    const cells = [...holder.querySelectorAll("td.code")];
    // One row is the common case - a single line lifted out - and it carries the numbers just as a span of rows does.
    // Only a selection wholly inside one line's text brings no cell with it, and that one the browser already gets right.
    if (!cells.length) return;
    const code = cells.map((cell) => cell.textContent).join("\n");
    event.clipboardData.setData("text/plain", code);
    // Only take over the copy once the replacement is known to have been accepted: preventing the default after a
    // refused write would put nothing on the clipboard at all, which is worse than the numbers coming along.
    if (event.clipboardData.getData("text/plain") === code) event.preventDefault();
  });

  document.addEventListener("pointermove", (event) => {
    // A release outside the window is never delivered, so a move with no button held is the release itself. Without
    // this the desk stays mid-drag for good: every later hover keeps extending a range nobody is holding.
    if (drag.on && event.buttons === 0) {
      endDrag();
      return;
    }
    if (drag.on) {
      // A range longer than the view has to be reachable, so nearing an edge scrolls rather than stopping there.
      const above = event.clientY - EDGE;
      const below = event.clientY - (window.innerHeight - EDGE);
      if (above < 0) window.scrollBy(0, Math.max(above, -24));
      else if (below > 0) window.scrollBy(0, Math.min(below, 24));
    }
    overDrag(event.clientX, event.clientY);
  });
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);
  document.addEventListener("mouseup", endDrag);
  window.addEventListener("blur", endDrag);

  // A line range is only expressible on one side, so a range touching added or unchanged lines is anchored there and
  // the removed lines it covers ride along; a range of removed lines alone is anchored on the removed side.
  function anchorSel() {
    const rows = selRows();
    if (!rows.length) return null;
    const side = rows.some((row) => row.dataset.side === "new") ? "new" : "old";
    const numbers = rows.filter((row) => row.dataset.side === side).map((row) => Number(row.dataset.line));
    return { row: rows[rows.length - 1], side, line: Math.min(...numbers), endLine: Math.max(...numbers) };
  }

  function composeSel() {
    const spot = anchorSel();
    if (spot) openComposer(spot.row, sel.path, spot.line, spot.endLine, spot.side);
  }

  function openFileComposer(card, file) {
    if (card.querySelector(".filenote.writing")) return;
    const box = document.createElement("div");
    box.className = "filenote writing";
    const field = document.createElement("textarea");
    field.placeholder = `Comment on ${file.path}, as a whole`;
    grows(field);
    const controls = document.createElement("div");
    controls.className = "row";
    const now = document.createElement("button");
    now.className = "solid direct";
    now.textContent = "Send";
    const keep = document.createElement("button");
    keep.className = "solid";
    keep.textContent = "Add to review";
    const drop = document.createElement("button");
    drop.className = "ghost";
    drop.textContent = "Cancel";
    controls.append(now, keep, drop);
    box.append(field, controls);
    card.querySelector(".filehead").after(box);
    field.focus();

    // A file comment carries no line, which is what tells it apart everywhere else: in the log, on the page, and in
    // what is posted to the pull request.
    const written = () => ({
      branch: branch().ref,
      review: review(),
      path: file.path,
      line: 0,
      side: "file",
      text: field.value.trim(),
      at: stamp(),
    });
    drop.addEventListener("click", () => box.remove());
    keep.addEventListener("click", () => {
      if (!field.value.trim()) return;
      notes.drafts.push(written());
      box.remove();
      drawTray();
      render();
    });
    now.addEventListener("click", async () => {
      if (!field.value.trim()) return;
      const alone = written();
      box.remove();
      await send1(alone);
    });
    field.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        keep.click();
      }
      if (event.key === "Escape") box.remove();
    });
  }

  function openComposer(afterRow, path, line, endLine, side) {
    if (afterRow.nextElementSibling && afterRow.nextElementSibling.dataset.composer === "true") return;
    const row = document.createElement("tr");
    row.className = "noterow";
    row.dataset.composer = "true";
    const cell = document.createElement("td");
    cell.colSpan = 5;
    const box = document.createElement("div");
    box.className = "notebox";
    const field = document.createElement("textarea");
    field.placeholder = `Comment on ${path.split("/").pop()}, ${endLine !== line ? `lines ${line}–${endLine}` : `line ${line}`}`;
    grows(field);
    const controls = document.createElement("div");
    controls.className = "row";
    const now = document.createElement("button");
    now.className = "solid direct";
    now.textContent = "Send";
    now.title = "Send this comment on its own";
    const send = document.createElement("button");
    send.className = "solid";
    send.textContent = "Add to review";
    const cancel = document.createElement("button");
    cancel.className = "ghost";
    cancel.textContent = "Cancel";
    const hint = document.createElement("span");
    hint.className = "status";
    hint.textContent = "\u2318/Ctrl + Enter";
    controls.append(now, send, cancel, hint);
    box.append(field, controls);
    cell.append(box);
    row.append(cell);
    afterRow.after(row);
    field.focus();

    const written = () => ({
      branch: branch().ref,
      review: review(),
      path,
      line,
      endLine,
      side,
      anchor: codeAt(path, endLine || line, side),
      text: field.value.trim(),
      at: stamp(),
    });

    const commit = () => {
      if (!field.value.trim()) return;
      notes.drafts.push(written());
      row.remove();
      clearSel();
      drawTray();
      render();
    };

    // Sent on its own: recorded, posted and threaded exactly like a batch, without waiting in the tray.
    const straight = async () => {
      if (!field.value.trim()) return;
      const alone = written();
      row.remove();
      clearSel();
      await send1(alone);
    };
    now.addEventListener("click", straight);
    send.addEventListener("click", commit);
    cancel.addEventListener("click", () => {
      row.remove();
      clearSel();
    });
    field.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        commit();
      }
      if (event.key === "Escape") {
        row.remove();
        clearSel();
      }
    });
  }

  /* ---------- the lines a diff leaves out ---------- */

  const CONTEXT_STEP = 20;

  function fileRev(file) {
    // A deleted file only exists on the base side; everything else is read from the branch under review.
    const { commit } = view();
    if (commit) return file.state === "deleted" ? `${commit.sha}^` : commit.sha;
    return file.state === "deleted" ? data.baseRef : branch().rev;
  }

  async function readLines(file, from, to, anchors) {
    // The lines this page holds on either side of the gap ride along, at the numbers it holds them: work on disk moves
    // while a page is open, and what the numbers name moves with it. Only this block's own surroundings are sent, so an
    // edit elsewhere in the same file - above it, below it - leaves the gap fillable, which is what a commit already is.
    const rev = fileRev(file);
    const held = rev || !anchors.length ? "" : `&anchors=${encodeURIComponent(JSON.stringify(anchors))}`;
    const where = `lines?dir=${encodeURIComponent(data.root)}&rev=${encodeURIComponent(rev)}&path=${encodeURIComponent(file.path)}&from=${from}&to=${to}${held}`;
    try {
      return await (await fetch(where, { cache: "no-store" })).json();
    } catch (error) {
      return { lines: [], total: 0 };
    }
  }

  function sayStale(file) {
    // Said where the reader pressed, and the Refresh lit, since reading these lines is what the refresh is now for.
    els.moved.disabled = false;
    const said = "the lines around this hunk have changed on disk, so what is there now is not what this diff was built from";
    announce("refresh", file.path.split("/").pop(), said);
  }

  function redrawCard(file, index) {
    const old = document.getElementById(`f${index}`);
    if (!old) return;
    const fresh = card(file, index);
    fresh.dataset.open = old.dataset.open;
    clearSel();
    old.replaceWith(fresh);
    settleBody(fresh);
    nearby.observe(fresh);
  }

  const lastNumbered = (rows) => [...rows].reverse().find((row) => row[0] !== "h" && row[2] > 0);

  async function fillGap(file, index, at, upward, whole) {
    const head = file.lines[at];
    const above = lastNumbered(file.lines.slice(0, at));
    const previous = above ? above[2] : 0;
    const room = head[2] - previous - 1;
    const wanted = whole ? room : Math.min(CONTEXT_STEP, room);
    if (wanted <= 0) return;
    const from = upward ? head[2] - wanted : previous + 1;
    const below = file.lines[at + 1];
    const anchors = [];
    if (above) anchors.push([above[2], above[3]]);
    if (below && below[2] > 0) anchors.push([below[2], below[3]]);
    const slice = await readLines(file, from, from + wanted - 1, anchors);
    if (slice.stale) return sayStale(file);
    // Context lines advance both sides, so the offset between them holds across the whole gap.
    const offset = head[1] - head[2];
    const rows = slice.lines.map((text, step) => ["c", from + step + offset, from + step, text]);
    file.lines.splice(upward ? at + 1 : at, 0, ...rows);
    if (upward) {
      head[1] -= rows.length;
      head[2] -= rows.length;
    }
    redrawCard(file, index);
  }

  // A hunk head with lines missing above it, if the file still has one: what "expand all" works through.
  const nextGap = (file) =>
    file.lines.findIndex((row, at) => {
      if (row[0] !== "h") return false;
      const above = lastNumbered(file.lines.slice(0, at));
      return row[2] - (above ? above[2] : 0) - 1 > 0;
    });

  async function fillWholeFile(file, index) {
    // Each fill renumbers what follows it, so the gaps are taken from the top, one at a time. A gap that does not close
    // is the diff having moved under the reader, which fillGap has already said: stopping there leaves that news up.
    for (let gap = nextGap(file); gap !== -1; gap = nextGap(file)) {
      const held = file.lines.length;
      await fillGap(file, index, gap, true, true);
      if (file.lines.length === held) return;
    }
    for (let held = file.lines.length; ; held = file.lines.length) {
      await fillTail(file, index);
      if (file.lines.length === held) return;
    }
  }

  async function fillTail(file, index) {
    const last = lastNumbered(file.lines);
    if (!last) return;
    const slice = await readLines(file, last[2] + 1, last[2] + CONTEXT_STEP, [[last[2], last[3]]]);
    if (slice.stale) return sayStale(file);
    if (!slice.lines.length) return;
    const offset = last[1] - last[2];
    file.lines.push(...slice.lines.map((text, step) => ["c", last[2] + 1 + step + offset, last[2] + 1 + step, text]));
    redrawCard(file, index);
  }

  /* ---------- chrome ---------- */

  function renderTabs() {
    els.tabs.innerHTML = "";
    data.branches.forEach((entry, index) => {
      const request = entry.pr;
      const tab = document.createElement("button");
      tab.className = "tab";
      tab.setAttribute("role", "tab");
      tab.textContent = entry.blurb;
      tab.setAttribute("aria-selected", String(index === state.branch));
      if (request) {
        tab.title = `${request.title}\n${request.url}`;
        const away = document.createElement("span");
        away.className = "away";
        away.textContent = "\u2197";
        tab.append(away);
      }
      // Selecting comes first, since that is what a tab is for; once selected, the same click opens the pull request.
      tab.addEventListener("click", () => {
        if (request && index === state.branch) {
          window.open(request.url, "_blank", "noreferrer");
          return;
        }
        state.branch = index;
        state.scope = "all";
        [...els.tabs.children].forEach((node, i) => node.setAttribute("aria-selected", String(i === index)));
        renderScopes();
        render();
      });
      els.tabs.append(tab);
    });
  }

  /* ---------- picking what to review ---------- */

  const source = { refs: [], pulls: [], current: "", picked: new Set() };

  async function loadRefs() {
    els.srcstatus.textContent = "reading branches...";
    const where = `refs?dir=${encodeURIComponent(els.srcdir.value)}&base=${encodeURIComponent(els.srcbase.value)}`;
    try {
      const info = await (await fetch(where, { cache: "no-store" })).json();
      source.refs = info.refs;
      source.pulls = info.pulls || [];
      source.current = info.current;
      source.picked = new Set(data.branches.map((entry) => entry.ref));
      drawRefs();
      const counted = [`${info.refs.length} ahead of ${els.srcbase.value}`];
      if (source.pulls.length) counted.push(`${source.pulls.length} open PR${source.pulls.length === 1 ? "" : "s"}`);
      if (info.upstream) counted.push(info.upstream);
      els.srcstatus.textContent = counted.join(" \u00b7 ");
    } catch (error) {
      source.refs = [];
      source.pulls = [];
      els.srcrefs.innerHTML = "";
      els.srcpulls.innerHTML = "";
      els.srcstatus.textContent = "needs the local server";
    }
  }

  function drawRefs() {
      const query = els.srcfilter.value.trim().toLowerCase();
      // A branch already picked stays listed whatever the filter says, so a selection cannot be lost out of view.
      const rows = source.refs.filter((row) => !query || row.ref.toLowerCase().includes(query) || source.picked.has(row.ref));
      els.srcrefs.innerHTML = "";
      for (const row of rows) {
        const label = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.value = row.ref;
        box.checked = source.picked.has(row.ref);
        box.addEventListener("change", () => {
          if (box.checked) source.picked.add(row.ref);
          else source.picked.delete(row.ref);
        });
        const name = document.createElement("span");
        name.textContent = row.ref === source.current ? `${row.ref} *` : row.ref;
        const ahead = document.createElement("span");
        ahead.className = "ahead";
        ahead.textContent = `${row.ahead} commit${row.ahead === 1 ? "" : "s"}`;
        label.append(box, name, ahead);
        els.srcrefs.append(label);
      }
      els.srcpulls.innerHTML = "";
      const wanted = source.pulls.filter(
        (row) => !query || `#${row.number} ${row.title} ${row.headRefName}`.toLowerCase().includes(query),
      );
      if (wanted.length) {
        const title = document.createElement("span");
        title.className = "label";
        title.textContent = "Pull requests";
        els.srcpulls.append(title);
      }
      for (const row of wanted) {
        const label = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.value = `#${row.number}`;
        box.checked = source.picked.has(box.value);
        box.addEventListener("change", () => {
          if (box.checked) source.picked.add(box.value);
          else source.picked.delete(box.value);
        });
        const name = document.createElement("span");
        name.textContent = `#${row.number}`;
        const what = document.createElement("span");
        what.className = "ahead";
        what.textContent = row.title;
        label.title = `${row.title} (${row.headRefName})`;
        label.append(box, name, what);
        els.srcpulls.append(label);
      }
  }

  async function rescan(keep) {
    const refs = keep ? data.branches.map((entry) => entry.ref) : [...source.picked];
    const reading = keep ? { ...state } : { branch: 0, scope: "all", current: 0 };
    const where = keep ? { dir: data.root, base: data.baseRef } : { dir: els.srcdir.value, base: els.srcbase.value };
    els.srcstatus.textContent = "collecting diffs...";
    // Collecting the diffs takes a moment, so the button says it heard: it reports what it is doing and refuses a
    // second press until it is done.
    els.moved.dataset.busy = "true";
    els.moved.disabled = true;
    let landed = false;
    try {
      const outcome = await (
        await fetch("scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...where, refs }),
        })
      ).json();
      if (!outcome.ok) {
        els.srcstatus.textContent = outcome.error;
        return;
      }
      data = outcome.data;
      Object.assign(state, reading);
      // A branch that has gone from the payload cannot be the one being read.
      if (!data.branches[state.branch]) state.branch = 0;
      // Collected: there is nothing left to refresh until the branch moves again.
      landed = true;
      clearSel();
      showSource();
      renderTabs();
      renderScopes();
      render();
      els.srcstatus.textContent = `${data.branches.length} branch${data.branches.length === 1 ? "" : "es"} loaded`;
      els.source.dataset.open = "false";
      els.sourceopen.setAttribute("aria-pressed", "false");
    } catch (error) {
      els.srcstatus.textContent = `scan failed: ${error.message}`;
    } finally {
      // Pressable again when the scan did not land, since the branch has still moved on.
      delete els.moved.dataset.busy;
      els.moved.disabled = landed;
    }
  }

  function renderScopes() {
    els.scope.innerHTML = "";
    const all = document.createElement("option");
    all.value = "all";
    all.textContent = `${branch().dirty ? "Working tree" : "All commits"} · ${branch().commits.length} commits`;
    els.scope.append(all);
    branch().commits.forEach((commit, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = `${commit.sha}  ${commit.subject}`;
      els.scope.append(option);
    });
  }

  const view = () => (state.scope === "all" ? { files: branch().files, commit: null } : { files: branch().commits[Number(state.scope)].files, commit: branch().commits[Number(state.scope)] });

  function visible(files) {
    const query = state.query.trim().toLowerCase();
    return query ? files.filter((file) => file.path.toLowerCase().includes(query)) : files;
  }

  /* ---------- picking a file by name ---------- */

  let picked = 0;

  function drawPicks() {
    const shown = visible(view().files);
    picked = Math.min(picked, Math.max(0, shown.length - 1));
    els.picks.innerHTML = "";
    if (!shown.length) {
      const none = document.createElement("div");
      none.className = "picknone";
      none.textContent = "No file matches";
      els.picks.append(none);
      return;
    }
    shown.forEach((file, order) => {
      const row = document.createElement("button");
      row.className = "pick";
      row.dataset.on = String(order === picked);
      row.dataset.done = String(seenState(file) === "done");
      row.dataset.path = file.path;
      const name = document.createElement("b");
      name.textContent = file.path.split("/").pop();
      const where = document.createElement("span");
      where.className = "where";
      where.textContent = file.path.split("/").slice(0, -1).join("/");
      row.insertAdjacentHTML("beforeend", tickMark);
      row.prepend(where);
      row.prepend(name);
      row.addEventListener("mousemove", () => {
        if (row.dataset.on === "true") return;
        picked = order;
        drawPicks();
      });
      row.addEventListener("click", () => takePick(order));
      els.picks.append(row);
    });
    const on = els.picks.querySelector('.pick[data-on="true"]');
    if (on) on.scrollIntoView({ block: "nearest" });
  }

  function openPicker() {
    // The overlay carries the box being typed in, so what the reader looks at while picking is one panel rather than a
    // list hanging off the bar. The filter already typed comes with it, and goes back to the bar when it closes.
    if (!els.palette.hidden) return;
    els.pq.value = els.q.value;
    els.veil.hidden = false;
    els.palette.hidden = false;
    document.body.classList.add("picking");
    picked = 0;
    drawPicks();
    els.pq.focus();
    els.pq.select();
  }

  function closePicker() {
    if (els.palette.hidden) return;
    els.veil.hidden = true;
    els.palette.hidden = true;
    document.body.classList.remove("picking");
    els.q.value = els.pq.value;
  }

  function movePick(step) {
    const rows = els.picks.querySelectorAll(".pick");
    if (!rows.length) return;
    picked = (picked + step + rows.length) % rows.length;
    drawPicks();
  }

  function takePick(order) {
    const shown = visible(view().files);
    const file = shown[order === undefined ? picked : order];
    if (!file) return;
    closePicker();
    const card = document.querySelector(`section.file[data-path="${CSS.escape(file.path)}"]`);
    if (card) jump(Number(card.id.slice(1)));
  }

  const chevron = '<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>';
  const tickMark = '<svg class="tick" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 6.5 4.7 9 10 3.5"/></svg>';

  function render() {
    const { files, commit } = view();
    const staleCount = countStale(files);
    const shown = visible(files);
    const added = files.reduce((sum, file) => sum + file.added, 0);
    const removed = files.reduce((sum, file) => sum + file.removed, 0);
    const done = files.filter((file) => seenState(file) === "done").length;
    els.tplus.textContent = `+${added.toLocaleString()}`;
    els.tminus.textContent = `−${removed.toLocaleString()}`;
    els.ptext.textContent = staleCount
      ? `${done}/${files.length} reviewed\n${staleCount} reopened`
      : `${done}/${files.length} reviewed`;
    els.ptext.dataset.stale = String(Boolean(staleCount));
    els.ptext.title = staleCount
      ? `${staleCount} file(s) changed since they were reviewed, so their ticks were dropped`
      : "Files marked reviewed";
    els.pfill.style.width = files.length ? `${Math.round((done / files.length) * 100)}%` : "0%";
    if (!els.palette.hidden) drawPicks();
    sayWhereToStep();
    showStatus(staleCount);

    els.filelist.innerHTML = "";
    els.filelist.append(fileTree(shown));

    els.main.innerHTML = "";
    if (commit) {
      const note = document.createElement("div");
      note.className = "commitnote";
      note.innerHTML = '<span class="sha"></span><span class="subject"></span>';
      note.querySelector(".sha").textContent = commit.sha;
      note.querySelector(".subject").textContent = commit.subject;
      els.main.append(note);
    }
    if (!shown.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = state.query ? `No file matches “${state.query}”.` : "No changes in this view.";
      els.main.append(empty);
      return;
    }
    nearby.disconnect();
    shown.forEach((file, index) => els.main.append(card(file, index)));
    settleNear();
    for (const wrap of els.main.querySelectorAll("section.file")) nearby.observe(wrap);
    fitNotes();
    markCurrent();
    paintSel();
  }

  // Written before the page is painted: the observer below only hears about a body a frame later, and a comment left
  // without a width of its own falls back to filling the table, which redistributes every column under it.
  function fitNotes() {
    for (const body of els.main.querySelectorAll("section.file[data-open='true'] .body")) {
      const room = body.clientWidth;
      if (room) body.style.setProperty("--seen", `${Math.round(room)}px`);
    }
  }

  // A review is read a screenful at a time, so that is what the page holds: every file keeps its header, and the lines
  // of one are built when the reader comes within reach of it and let go once they are well past. A card let go keeps
  // the height it had, so nothing under the reader moves as they go.
  const drawn = new WeakMap();
  const NEAR = 1.5;
  // The jump in flight - the card it goes to, and the thread it aims at inside it - kept while it is: a scroll still
  // travelling leaves the card as far off as it was, and letting go of it there is letting go of what is being gone to.
  let reaching = null;
  // What a file's lines take up, so a card whose lines are not built still stands as tall as it will: without it the
  // page grows under the reader as they go, and the scrollbar means nothing until they have been everywhere.
  const heights = new Map();
  let rowRoom = 0;

  function roomPerRow() {
    if (!rowRoom) {
      const row = document.querySelector("table tr[data-line]");
      rowRoom = row ? row.getBoundingClientRect().height : 0;
    }
    // Before a single row has been built there is nothing to measure, so a row's own line height stands in for it.
    return rowRoom || 18;
  }

  function roomForLines(file) {
    // The lines, and the comments hanging among them: a file carrying a long remark stands a good deal taller than its
    // rows, and a reservation that forgets them leaves the page shorter than it turns out to be.
    const rows = file.lines.length * roomPerRow();
    const said = mine()
      .filter((note) => note.path === file.path)
      .reduce((sum, note) => sum + roomForThread(note), 0);
    return Math.round(rows + said);
  }

  function roomForThread(note) {
    // Read off what it says: its lines, the width the reader has, and its replies, each with a line of its own.
    const room = Math.max(40, Math.round((window.innerWidth - 320) / 7.4));
    const lines = (text) =>
      String(text)
        .split("\n")
        .reduce((sum, line) => sum + Math.max(1, Math.ceil(line.length / room)), 0);
    const answers = (note.replies || []).reduce((sum, answer) => sum + lines(answer.text) + 1, 0);
    return (lines(note.text) + answers + 2) * roomPerRow() + 18;
  }

  const nearby = new IntersectionObserver((entries) => {
    for (const entry of entries) settleBody(entry.target);
    // What a jump lands on is aimed at again from here: these are the files it brought within reach, and each one
    // built stands at what its lines measure rather than at what was reserved for them, which moves everything below.
    if (reaching) aim(reaching.thread, 2, false);
  }, { rootMargin: `${Math.round(NEAR * 100)}% 0px` });

  // What each file's body can actually show, and how far it has been scrolled: together they keep every comment on
  // screen whatever the width of the diff it hangs under.
  const roomFor = new ResizeObserver((entries) => {
    // Written on the next frame, and only when it changes: what it sets moves the comments hanging inside, which the
    // observer would otherwise see again within the same delivery.
    // A folded file reports no room at all, which is not a width its comments should take: sized to nothing they fill
    // the table instead, collapsing the code column and stretching the page. What it last had room for stands.
    const rooms = entries
      .filter((entry) => entry.contentRect.width)
      .map((entry) => [entry.target, `${Math.round(entry.contentRect.width)}px`]);
    requestAnimationFrame(() => {
      for (const [node, room] of rooms) {
        if (node.style.getPropertyValue("--seen") !== room) node.style.setProperty("--seen", room);
      }
    });
  });

  function follow(body) {
    body.style.setProperty("--slid", `${Math.round(body.scrollLeft)}px`);
  }

  function holdPlace(path, change) {
    // Reading a diff is linear, so a change that shortens what is above the reader must not carry them forwards over
    // diffs they have not seen. Where the anchor still begins below the reader, its place is simply held; where the
    // reader had already passed its start - folding away the file they were inside - they are brought back to where
    // reading now continues, which is that file's head and the next file under it.
    const at = (file) => {
      const node = file && document.querySelector(`section.file[data-path="${CSS.escape(file)}"]`);
      return node ? node.getBoundingClientRect().top : null;
    };
    const covered = document.querySelector("header").getBoundingClientRect().bottom;
    const before = at(path);
    const passed = before !== null && before < covered;
    change();
    const after = at(path);
    if (after === null || before === null) return;
    if (passed) document.querySelector(`section.file[data-path="${CSS.escape(path)}"]`).scrollIntoView({ block: "start" });
    else window.scrollBy(0, after - before);
    // Landed on a whole pixel: a place held to a fraction leaves a hairline of what came before it showing, and where
    // that lands is a matter of how each engine rounds a scroll margin.
    window.scrollTo(0, Math.round(window.scrollY));
  }

  function card(file, index) {
    const status = seenState(file);
    const wrap = document.createElement("section");
    wrap.className = "file";
    const held = folds.get(file.path);
    // A comment that arrived after the reader put the file down outranks the fold: it is news, and news is shown. One
    // they had already left unread does not, or saying "I am done with this file" would never hold.
    const since = held ? held.upTo : -1;
    const unread = mine().some((note) => note.path === file.path && note.seq > since && !(note.seq in heard));
    const shown = held && held.digest === file.digest ? held.open : status !== "done";
    wrap.dataset.open = String(unread || shown);
    wrap.dataset.done = String(status === "done");
    wrap.dataset.path = file.path;
    wrap.dataset.digest = file.digest;
    wrap.id = `f${index}`;

    const head = document.createElement("div");
    head.className = "filehead";

    const grow = document.createElement("button");
    grow.className = "grow";
    grow.innerHTML = chevron + '<span class="path"></span>';
    grow.querySelector(".path").textContent = file.path;
    if (file.state) {
      const chip = document.createElement("span");
      chip.className = `chip ${file.state}`;
      chip.textContent = file.state;
      grow.append(chip);
    }
    if (status === "stale") {
      const chip = document.createElement("span");
      chip.className = "chip stale";
      chip.textContent = "changed since review";
      grow.append(chip);
    }
    const fold = () => {
      wrap.dataset.open = wrap.dataset.open === "true" ? "false" : "true";
      folds.set(file.path, { digest: file.digest, open: wrap.dataset.open === "true", upTo: latest() });
      settleBody(wrap);
      fitNotes();
    };
    grow.addEventListener("click", fold);
    // The whole header folds the file, not the path alone: the icons beside it leave room a click can land on, and
    // reaching for the file's own name is not what a reader means by it. What they land on instead answers for itself.
    head.addEventListener("click", (event) => {
      if (!event.target.closest("button, label, input, a, textarea")) fold();
    });

    const copy = document.createElement("button");
    copy.className = "icon copy";
    copy.dataset.tip = "Copy this path";
    copy.setAttribute("aria-label", `Copy ${file.path}`);
    copy.innerHTML =
      '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">' +
      '<rect x="4.6" y="1.6" width="7.8" height="9.8" rx="1.6"/>' +
      '<path d="M9.4 12.4H3.2a1.6 1.6 0 0 1-1.6-1.6V4.2"/></svg>';
    copy.addEventListener("click", async (event) => {
      event.stopPropagation();
      await navigator.clipboard.writeText(file.path);
      copy.dataset.copied = "true";
      window.setTimeout(() => delete copy.dataset.copied, 1200);
    });

    const opener = document.createElement("button");
    opener.className = "icon";
    opener.dataset.tip = "Show every line of this file";
    opener.setAttribute("aria-label", `Show every line of ${file.path}`);
    opener.innerHTML =
      '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">' +
      '<path d="M7 5.8V1.6l-2.2 2.2M7 1.6l2.2 2.2"/><path d="M7 8.2v4.2l2.2-2.2M7 12.4l-2.2-2.2"/></svg>';
    opener.addEventListener("click", (event) => {
      event.stopPropagation();
      wrap.dataset.open = "true";
      folds.set(file.path, { digest: file.digest, open: true, upTo: latest() });
      fillWholeFile(file, index);
    });

    const counts = document.createElement("span");
    counts.className = "counts";
    counts.innerHTML = `<span class="plus num">+${file.added}</span><span class="minus num">−${file.removed}</span>`;

    const seenLabel = document.createElement("label");
    seenLabel.className = "seen";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = status === "done";
    box.addEventListener("change", () => {
      // The card itself stays put unless it is about to be hidden, in which case the one after it takes its place.
      const shown = visible(view().files);
      const following = shown[shown.indexOf(file) + 1];
      const anchor = box.checked && document.body.classList.contains("hide-done") ? following : file;
      holdPlace(anchor && anchor.path, () => {
        setSeen(file, box.checked);
        // Marking a file reviewed says its comments have been read as well, which is what keeps it folded through a
        // reload - and leaves it to whatever is said afterwards to open it again.
        if (box.checked) markRead(file.path);
        wrap.dataset.done = String(box.checked);
        wrap.dataset.open = String(!box.checked);
        folds.set(file.path, { digest: file.digest, open: !box.checked, upTo: latest() });
        render();
      });
    });
    seenLabel.append(box, document.createTextNode("Reviewed"));

    const whole = document.createElement("button");
    whole.className = "icon";
    whole.dataset.tip = "Comment on this file";
    whole.setAttribute("aria-label", `Comment on ${file.path}`);
    whole.innerHTML =
      '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">' +
      '<path d="M12.4 8.2a1.6 1.6 0 0 1-1.6 1.6H6.2l-3 2.4V9.8h-.6A1.6 1.6 0 0 1 1.6 8.2V3.4a1.6 1.6 0 0 1 1.6-1.6h7.6a1.6' +
      ' 1.6 0 0 1 1.6 1.6z"/></svg>';
    whole.addEventListener("click", () => openFileComposer(wrap, file));

    head.append(grow, copy, opener, counts, whole, seenLabel);
    wrap.append(head);

    for (const note of notesAt(file.path, 0, "file")) {
      note.source = notes.drafts.find((draft) => draft.text === note.text && draft.path === note.path);
      const holder = document.createElement("div");
      holder.className = "filenote";
      holder.dataset.seq = note.seq;
      const built = noteRow(note);
      if (built.dataset.done) holder.dataset.done = built.dataset.done;
      holder.append(built.querySelector(".thread"));
      wrap.append(holder);
    }

    const body = document.createElement("div");
    body.className = "body";
    // As tall as its lines will be, until they are built and it is exactly as tall as they are.
    if (!file.binary) body.style.minHeight = `${heights.get(file.path) || roomForLines(file)}px`;
    roomFor.observe(body);
    body.addEventListener("scroll", () => follow(body), { passive: true });
    wrap.append(body);
    // What this card is of, so the lines can be built into it when the reader comes near and dropped when they leave.
    drawn.set(wrap, { file, index });
    return wrap;
  }

  function fillBody(wrap, file, index) {
    const body = wrap.querySelector(":scope > .body");
    if (!body || body.dataset.filled === "true") return;
    body.dataset.filled = "true";
    body.style.minHeight = "";
    if (file.binary) {
      const note = document.createElement("div");
      note.className = "empty";
      note.textContent = "Binary file";
      body.append(note);
    } else {
      const table = document.createElement("table");
      const tbody = document.createElement("tbody");
      // What each row reads as, worked out for the whole file at once.
      const painted = paintFile(file, tongueFor(file.path));
      const keys = present();
      const stranded = mine().filter((note) => note.path === file.path && isOutdated(note, keys));
      // Which line each stranded comment hangs under: the last one the diff still shows at or above where it was
      // written, or the first one shown when it was written above all of them. Kept as `side|line` so the row loop can
      // recognise its own place without holding on to rows that do not exist yet.
      const hangs = new Map();
      for (const note of stranded) {
        const wanted = placed(note);
        const lines = file.lines
          .filter((row) => row[0] !== "h" && rowSide(row) === note.side)
          .map((row) => placedLine(row, note.side));
        const above = lines.filter((line) => line <= wanted);
        const line = above.length ? Math.max(...above) : lines.length ? Math.min(...lines) : null;
        if (line !== null) hangs.set(note.seq, `${note.side}|${line}`);
      }
      for (let order = 0; order < file.lines.length; order += 1) {
        const [kind, oldNo, newNo, text] = file.lines[order];
        const row = document.createElement("tr");
        row.className = kind;
        if (kind === "h") {
          const cell = document.createElement("td");
          cell.colSpan = 5;
          const above = lastNumbered(file.lines.slice(0, order));
          const room = newNo - (above ? above[2] : 0) - 1;
          if (room <= 0) continue;
          if (notes.live) {
            const spot = order;
            if (room > CONTEXT_STEP) {
              for (const [label, upward] of [[`+${CONTEXT_STEP} up`, true], [`+${CONTEXT_STEP} down`, false]]) {
                if (!upward && !above) continue;
                const button = document.createElement("button");
                button.className = "expand";
                button.textContent = label;
                button.addEventListener("click", () => fillGap(file, index, spot, upward, false));
                cell.append(button);
              }
            }
            const whole = document.createElement("button");
            whole.className = "expand";
            whole.textContent = room > CONTEXT_STEP ? `all ${room}` : `+${room}`;
            whole.title = "Show every line between the hunks";
            whole.addEventListener("click", () => fillGap(file, index, spot, true, true));
            cell.append(whole);
          }
          const label = document.createElement("span");
          label.className = "at";
          label.textContent = text ? `@@ ${text}` : "@@";
          cell.append(label);
          row.append(cell);
          tbody.append(row);
          continue;
        }
        const line = kind === "d" ? oldNo : newNo;
        const side = kind === "d" ? "old" : "new";
        row.dataset.path = file.path;
        row.dataset.line = String(line);
        row.dataset.side = side;
        row.dataset.seq = String(order);

        const left = document.createElement("td");
        left.className = "ln";
        left.textContent = kind === "a" ? "" : String(oldNo);
        const right = document.createElement("td");
        right.className = "ln";
        right.textContent = kind === "d" ? "" : String(newNo);
        const gut = document.createElement("td");
        gut.className = "gut";
        const pin = document.createElement("button");
        pin.className = "pin";
        pin.textContent = "+";
        pin.title = "Comment on the selected lines";
        pin.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          event.stopPropagation();
          if (pin.setPointerCapture) pin.setPointerCapture(event.pointerId);
          pin.classList.add("held");
          startDrag(row);
        });
        pin.addEventListener("click", () => {
          if (!selRows().includes(row)) pick(row, false);
          composeSel();
        });
        gut.append(pin);
        const mark = document.createElement("td");
        mark.className = "mark";
        mark.textContent = kind === "a" ? "+" : kind === "d" ? "−" : " ";
        const code = document.createElement("td");
        code.className = "code";
        const coloured = painted.get(order);
        if (coloured === undefined) code.textContent = text;
        else code.innerHTML = coloured;

        const select = (event) => pick(row, event.shiftKey);
        for (const cell of [left, right, gut, mark]) cell.addEventListener("click", select);
        row.addEventListener("pointerdown", (event) => {
          if (event.button !== 0 || event.shiftKey) return;
          if (event.target.closest("button, textarea, input")) return;
          // Only the rail starts a range: it carries no text. Dragging across the code is how one selects the code
          // itself, and a range drag there would wipe that selection the moment it left the line.
          if (event.target.closest("td.code")) return;
          startDrag(row);
        });
        row.append(left, right, gut, mark, code);
        tbody.append(row);

        // A comment left behind is placed by the pass below, so it is skipped here: its recorded line often still
        // exists, and rendering it in both places showed the reader the same remark twice.
        const behind = new Set(stranded.map((note) => note.seq));
        for (const note of notesAt(file.path, line, side).filter((note) => !behind.has(note.seq))) {
          note.source = notes.drafts.find((draft) => draft.text === note.text && draft.line === note.line && draft.path === note.path);
          tbody.append(noteRow(note));
        }
        // A comment whose line is gone is shown against the nearest line still in the diff, so it keeps the place that
        // gave it its meaning: packed at the foot of the file it is neither noticed nor recognisable.
        for (const note of stranded.filter((note) => hangs.get(note.seq) === `${side}|${line}`)) {
          tbody.append(noteRow({ ...note, outdated: true }));
        }
      }
      // A file whose diff shows nothing on the side a comment was written against has nowhere to hang it, and a comment
      // is never dropped: those go last, which is where every stranded comment used to go.
      for (const note of stranded.filter((note) => !hangs.has(note.seq))) {
        tbody.append(noteRow({ ...note, outdated: true }));
      }
      if (notes.live && lastNumbered(file.lines)) {
        const row = document.createElement("tr");
        row.className = "h";
        const cell = document.createElement("td");
        cell.colSpan = 5;
        const button = document.createElement("button");
        button.className = "expand";
        button.textContent = `+${CONTEXT_STEP} below`;
        button.addEventListener("click", () => fillTail(file, index));
        cell.append(button);
        row.append(cell);
        tbody.append(row);
      }
      table.append(tbody);
      body.append(table);
    }
  }

  function releaseBody(wrap) {
    const body = wrap.querySelector(":scope > .body");
    if (!body || body.dataset.filled !== "true") return;
    // The height it had stands in for the lines let go of, so the scrollbar says the same thing before and after.
    const held = Math.round(body.getBoundingClientRect().height);
    const of = drawn.get(wrap);
    if (held && of) {
      // What it measured while it was built, which is what it stands at from now on however often it comes and goes.
      heights.set(of.file.path, held);
      body.style.minHeight = `${held}px`;
    }
    delete body.dataset.filled;
    body.replaceChildren();
  }

  function nearReader(wrap) {
    const room = window.innerHeight * NEAR;
    const box = wrap.getBoundingClientRect();
    return box.bottom > -room && box.top < window.innerHeight + room;
  }

  function settleBody(wrap) {
    const held = drawn.get(wrap);
    if (!held) return;
    // A card let go stands at what its lines measured, and one built stands at what they measure, so what a settle
    // does above the reader is a change of nothing at all. Where an estimate turns out to be off, the browsers hold
    // the place themselves; scrolling for it by hand walks the page a line at a time as each settle nudges the next.
    const wanted = nearReader(wrap) || (reaching !== null && wrap === reaching.card);
    if (wrap.dataset.open === "true" && wanted) fillBody(wrap, held.file, held.index);
    else releaseBody(wrap);
  }

  function settleNear() {
    const cards = [...document.querySelectorAll("section.file")];
    for (const wrap of cards) settleBody(wrap);
    // Reserved after the near ones are built, since what a row takes up is read off a row: reserving before there is
    // one to measure leaves the page taller than it turns out to be, and shrinking under the reader as they go.
    for (const wrap of cards) reserve(wrap);
  }

  function reserve(wrap) {
    const of = drawn.get(wrap);
    const body = wrap.querySelector(":scope > .body");
    if (!of || !body || body.dataset.filled === "true" || of.file.binary) return;
    body.style.minHeight = `${heights.get(of.file.path) || roomForLines(of.file)}px`;
  }

  function fileEntry(file, index) {
    const item = document.createElement("button");
    item.className = "fileitem";
    item.dataset.done = String(seenState(file) === "done");
    item.dataset.stale = String(seenState(file) === "stale");
    item.dataset.index = String(index);
    item.innerHTML =
      tickMark +
      `<span class="name"></span><span class="stat"><span class="bar"><i class="a" style="flex:${file.added}"></i>` +
      `<i class="d" style="flex:${file.removed}"></i></span><span class="num">${file.added + file.removed}</span></span>`;
    const name = item.querySelector(".name");
    name.textContent = file.path.split("/").pop();
    name.title = file.path;
    item.addEventListener("click", () => jump(index));
    return item;
  }

  function fileTree(shown) {
    // Directories with a single child are folded into their parent, so a deep path costs one row, not one per level.
    const root = { folders: new Map(), files: [] };
    shown.forEach((file, index) => {
      const parts = file.path.split("/");
      let node = root;
      for (const step of parts.slice(0, -1)) {
        if (!node.folders.has(step)) node.folders.set(step, { folders: new Map(), files: [] });
        node = node.folders.get(step);
      }
      node.files.push({ file, index });
    });

    const draw = (node, name, path, depth) => {
      const held = [name];
      let here = node;
      while (here.folders.size === 1 && !here.files.length) {
        const [only] = here.folders.keys();
        held.push(only);
        here = here.folders.get(only);
      }
      const shelf = document.createElement("div");
      shelf.className = "folder";
      const label = document.createElement("button");
      label.className = "foldername";
      label.style.paddingLeft = `${6 + depth * 12}px`;
      const inside = [...here.folders.values()].reduce((sum, child) => sum + count(child), 0) + here.files.length;
      label.innerHTML = chevron + '<span class="name"></span><span class="num"></span>';
      label.querySelector(".name").textContent = held.join("/");
      label.querySelector(".num").textContent = String(inside);
      const kids = document.createElement("div");
      kids.className = "kids";
      const shut = folded.has(path);
      shelf.dataset.open = String(!shut);
      label.addEventListener("click", () => {
        const open = shelf.dataset.open === "true";
        shelf.dataset.open = String(!open);
        if (open) folded.add(path);
        else folded.delete(path);
        localStorage.setItem("diffdesk.folded", JSON.stringify([...folded]));
      });
      for (const [childName, child] of here.folders) kids.append(draw(child, childName, `${path}/${childName}`, depth + 1));
      for (const { file, index } of here.files) {
        const entry = fileEntry(file, index);
        entry.style.paddingLeft = `${8 + (depth + 1) * 12}px`;
        kids.append(entry);
      }
      shelf.append(label, kids);
      return shelf;
    };

    const holder = document.createDocumentFragment();
    for (const [name, node] of root.folders) holder.append(draw(node, name, name, 0));
    for (const { file, index } of root.files) holder.append(fileEntry(file, index));
    return holder;
  }

  function count(node) {
    return [...node.folders.values()].reduce((sum, child) => sum + count(child), 0) + node.files.length;
  }

  const entries = () => [...els.filelist.querySelectorAll(".fileitem")];

  function markCurrent() {
    // Files sit at whatever depth the tree puts them, so the current one is found by the index it carries.
    for (const node of entries()) node.setAttribute("data-current", String(Number(node.dataset.index) === state.current));
  }

  function leftToReview(down) {
    // Counted from the file the reader is on, which is the last one whose head has passed the line a stepped-to file
    // comes to rest at - the header plus the breathing space the card's own scroll margin asks for, read off the style
    // so the two cannot drift apart. Measuring against the header alone would offer them the file they are reading.
    const cards = [...document.querySelectorAll("section.file")];
    if (!cards.length) return undefined;
    const covered = document.querySelector("header").getBoundingClientRect().bottom;
    const resting = Math.max(covered, parseFloat(getComputedStyle(cards[0]).scrollMarginTop) || covered) + 1;
    const below = cards.findIndex((card) => card.getBoundingClientRect().top > resting);
    const here = below === -1 ? cards.length - 1 : below - 1;
    const ahead = down ? cards.slice(here + 1) : cards.slice(0, Math.max(0, here)).reverse();
    return ahead.find((card) => card.dataset.done !== "true");
  }

  function stepThroughWhatIsLeft(down) {
    const card = leftToReview(down);
    if (card) jump(Number(card.id.slice(1)));
  }

  function sayWhereToStep() {
    els.pback.disabled = !leftToReview(false);
    els.pnext.disabled = !leftToReview(true);
  }

  function jump(index) {
    const target = document.getElementById(`f${index}`);
    if (!target) return;
    state.current = index;
    const entry = entries().find((node) => Number(node.dataset.index) === index);
    for (let shelf = entry && entry.closest(".folder"); shelf; shelf = shelf.parentElement.closest(".folder")) {
      shelf.dataset.open = "true";
    }
    markCurrent();
    target.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  els.pback.addEventListener("click", () => stepThroughWhatIsLeft(false));
  els.pnext.addEventListener("click", () => stepThroughWhatIsLeft(true));
  // What lies either side of the reader changes as they move, and a smooth scroll keeps moving after the press.
  let stepping = null;
  window.addEventListener("scroll", () => {
    if (stepping) return;
    stepping = requestAnimationFrame(() => {
      stepping = null;
      sayWhereToStep();
    });
  });

  els.scope.addEventListener("change", (event) => {
    state.scope = event.target.value;
    state.current = 0;
    render();
  });
  els.q.addEventListener("input", (event) => {
    state.query = event.target.value;
    state.current = 0;
    render();
  });
  // Pressing the box in the bar is what asks for the overlay; the caret belongs to the box inside it.
  els.q.addEventListener("focus", () => {
    openPicker();
    els.q.blur();
  });
  els.pq.addEventListener("input", (event) => {
    state.query = event.target.value;
    state.current = 0;
    picked = 0;
    render();
    drawPicks();
  });
  els.pq.addEventListener("keydown", (event) => {
    if (els.palette.hidden) return;
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      movePick(event.key === "ArrowDown" ? 1 : -1);
    }
    if (event.key === "Enter") {
      event.preventDefault();
      takePick();
    }
    if (event.key === "Escape") {
      // Stopped here, or the page's own Escape would take the box's focus away before the list closed.
      event.stopPropagation();
      closePicker();
    }
  });
  els.veil.addEventListener("click", closePicker);
  els.ctx.addEventListener("click", () => {
    const on = els.ctx.getAttribute("aria-pressed") !== "true";
    els.ctx.setAttribute("aria-pressed", String(on));
    document.body.classList.toggle("hide-context", on);
  });
  els.hidedone.addEventListener("click", () => {
    const on = els.hidedone.getAttribute("aria-pressed") !== "true";
    // Anchored on the first file still shown, so hiding what is done does not scroll the rest out from under the reader.
    const staying = visible(view().files).find((file) => seenState(file) !== "done");
    holdPlace(staying && staying.path, () => {
      els.hidedone.setAttribute("aria-pressed", String(on));
      document.body.classList.toggle("hide-done", on);
    });
  });
  els.hideclosed.addEventListener("click", () => {
    const on = els.hideclosed.getAttribute("aria-pressed") !== "true";
    const staying = visible(view().files)[0];
    holdPlace(staying && staying.path, () => {
      els.hideclosed.setAttribute("aria-pressed", String(on));
      document.body.classList.toggle("hide-closed", on);
    });
  });
  els.sourceopen.addEventListener("click", () => {
    const open = els.source.dataset.open !== "true";
    els.source.dataset.open = String(open);
    els.sourceopen.setAttribute("aria-pressed", String(open));
    if (open) loadRefs();
  });
  els.srcbase.addEventListener("change", loadRefs);
  els.srcdir.addEventListener("change", loadRefs);
  els.srcfilter.addEventListener("input", drawRefs);
  grows(els.traynote);
  els.toast.addEventListener("click", () => {
    els.toast.dataset.open = "false";
  });
  els.goto.addEventListener("keydown", (event) => {
    if (event.key === "Enter") goTo(els.goto.value);
    if (event.key === "Escape") els.goto.blur();
  });
  // A number in the address is a comment as well, so a link to one lands on it.
  window.addEventListener("hashchange", () => goTo(window.location.hash));
  els.srcscan.addEventListener("click", () => rescan(false));
  els.moved.addEventListener("click", () => rescan(true));
  els.traysend.addEventListener("click", submitReview);
  els.logopen.addEventListener("click", () => {
    els.log.dataset.open = els.log.dataset.open === "true" ? "false" : "true";
    drawLog();
  });
  els.logclose.addEventListener("click", () => {
    els.log.dataset.open = "false";
  });
  els.logretry.addEventListener("click", async () => {
    await retryOwed(true);
  });
  els.logsync.addEventListener("click", () => syncThere(true));
  els.logsend.addEventListener("click", () => sendThreads(alreadyThere()));
  els.logresolved.addEventListener("change", () => {
    drawLog();
    render();
  });
  els.logsort.addEventListener("change", () => {
    localStorage.setItem("diffdesk.logsort", els.logsort.value);
    drawLog();
  });
  els.logbind.addEventListener("click", async () => {
    const local = mine().filter((note) => note.github === "none");
    if (!local.length || !branch().pr) return;
    await post("bind", { seq: local.map((note) => note.seq), github: true, ...where() });
    await loadNotes();
    await retryOwed(true);
  });
  // Coming back online is the moment a post that could not be made becomes possible again.
  window.addEventListener("online", () => retryOwed(false));
  els.traydrop.addEventListener("click", () => {
    notes.drafts = [];
    els.traynote.value = "";
    drawTray();
    render();
  });

  document.addEventListener("keydown", (event) => {
    if (["INPUT", "SELECT", "TEXTAREA"].includes(event.target.tagName)) {
      if (event.key === "Escape") event.target.blur();
      return;
    }
    // A single letter is a shortcut of this page; the same letter held with a modifier belongs to the browser or the
    // system - Meta+C is a copy, Meta+R a reload - and taking those was what stopped copying from working at all.
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === "/") {
      event.preventDefault();
      els.q.focus();
      return;
    }
    if (event.key === "#") {
      event.preventDefault();
      els.goto.focus();
      els.goto.select();
      return;
    }
    const count = entries().length;
    if (event.key === "j" && count) jump(Math.min(state.current + 1, count - 1));
    if (event.key === "k" && count) jump(Math.max(state.current - 1, 0));
    if (event.key === "c") {
      event.preventDefault();
      composeSel();
    }
    if (event.key === "r") {
      const file = visible(view().files)[state.current];
      if (file) {
        setSeen(file, seenState(file) !== "done");
        render();
      }
    }
    if (event.key === "Escape") {
      els.toast.dataset.open = "false";
      clearSel();
    }
  });

  // Resolutions are posted by whoever is working through the comments, so an idle page picks them up on its own.
  async function tick() {
    // Never redraw under a gesture: rebuilding the table destroys the pin holding the pointer, and the release that
    // would have opened the comment box is delivered to a node that is no longer in the page.
    if (drag.on) return;
    await watchBranch();
    // Every box a comment is written in, whichever it is: a redraw rebuilds the card and takes the box with it.
    if (!notes.live || document.querySelector("tr[data-composer], .filenote.writing") || notes.drafts.length) return;
    // A box being typed into is rebuilt by a redraw, which takes the focus with it even when the words are kept.
    if (document.activeElement && document.activeElement.matches("textarea, input:not([type=checkbox])")) return;
    await loadNotes();
    drawLog();
    render();
    // A post that could not be made is retried on its own, as long as the browser believes it is connected.
    if (navigator.onLine) {
      await retryOwed(false);
      await syncThere(false);
    }
  }

  const polling = setInterval(tick, 10000);
  // A page on its way out stops asking: a request still in flight when it goes is reported as an error by some engines,
  // and there is nobody left to tell anyway.
  addEventListener("pagehide", () => clearInterval(polling));

  const measureHead = () => {
    const box = document.querySelector("header").getBoundingClientRect();
    document.documentElement.style.setProperty("--head", `${Math.round(box.height)}px`);
  };
  new ResizeObserver(measureHead).observe(document.querySelector("header"));
  measureHead();

  loadSeen();
  loadFolded();
  takeHeard();
  takeTucked();
  // How the panel was last read, kept across reloads the way its other choices are.
  els.logsort.value = localStorage.getItem("diffdesk.logsort") === "recent" ? "recent" : "batch";
  takeDrafts();
  showSource();
  renderTabs();
  renderScopes();
  render();
  drawTray();
  takeSeen().then(render);
  loadNotes().then(() => {
    drawLog();
    render();
    // Opened on a comment, the page goes to it: the comments are only known once they have been read.
    if (/^#\d+$/.test(window.location.hash)) goTo(window.location.hash);
  });
</script>
